<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="DWS Stock" />
<link rel="apple-touch-icon" href="/icon.png" />
<title>DWS Stock</title>
<!-- the phone twin of Capture Station (owner-approved three-screen design,
     2026-08-17): Overview / Orders / Stock behind a bottom tab bar, served
     over the tailnet. Self-contained on purpose: one file, no assets. -->
<style>
  :root {
    --bg: #F7F7F6; --surface: #FFFFFF; --border: #E4E2DC; --line: #EAE8E3;
    --text: #2F3437; --muted: #6E6B64; --faint: #A5A29C;
    --accent: #047857; --accent-soft: #DEF0E7; --neg: #9F2F2D; --neg-bg: #FDEBEC;
    --amber: #854F0B; --amber-bg: #FAEEDA;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { overscroll-behavior-y: contain; } /* our pull-to-refresh owns the top bounce */
  body { background: var(--bg); color: var(--text); font-family: 'Geist', system-ui, -apple-system, sans-serif; max-width: 520px; margin: 0 auto; padding: 14px 12px calc(64px + env(safe-area-inset-bottom)); }
  #ptr { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-52px); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 15px; font-size: 11px; font-weight: 600; color: var(--muted); transition: transform 160ms ease; z-index: 10; box-shadow: 0 2px 10px rgba(47,52,55,.10); }
  #ptr.show { transform: translateX(-50%) translateY(0); }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head h1 { font-size: 15px; font-weight: 600; }
  .head .date { font-size: 11px; color: var(--faint); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; }
  .k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .big { font-family: var(--mono); font-size: 34px; font-weight: 700; line-height: 1.15; margin: 3px 0 4px; }
  .delta { font-size: 11px; color: var(--accent); min-height: 15px; }
  .delta.neg { color: var(--neg); }
  .toggles { display: flex; gap: 8px; margin: 0 0 10px; }
  .seg { display: flex; background: #EFEEEA; border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { font-family: inherit; font-size: 11px; font-weight: 600; color: var(--muted); border: none; background: transparent; border-radius: 7px; padding: 5px 12px; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(47,52,55,.08); }
  .seg.wide { width: 100%; }
  .seg.wide button { flex: 1; }
  .aseg { margin-left: auto; }
  .aseg button { padding: 3px 9px; line-height: 1; }
  .aseg .a1 { font-size: 10px; }
  .aseg .a2 { font-size: 12px; }
  .aseg .a3 { font-size: 14px; }
  .chans { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--border); margin: 10px -14px -13px; }
  .chans > div { padding: 8px 6px 11px; text-align: center; }
  .chans > div + div { border-left: 1px solid var(--border); }
  .cn { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .cn.walmart { color: #2E86D9; } .cn.ebay { color: #047857; } .cn.temu { color: #C97B12; }
  .cv { font-family: var(--mono); font-size: 14px; font-weight: 700; margin-top: 2px; }
  svg { display: block; width: 100%; }
  .grid { border: 1px solid #E0DED8; border-radius: 6px; overflow: hidden; margin-top: 6px; font-size: 10.5px; }
  .grow, .ghead { display: grid; grid-template-columns: 92px 1fr 46px; }
  .ghead { background: #F4F3F0; border-bottom: 1px solid #E0DED8; font-size: 8.5px; font-weight: 700; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; }
  .ghead span, .grow span { padding: 5px 7px; border-right: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead span:last-child, .grow span:last-child { border-right: none; text-align: right; }
  .grow { border-bottom: 1px solid var(--line); background: var(--surface); }
  .grow:last-child { border-bottom: none; }
  .grow .po { font-family: var(--mono); font-weight: 600; font-size: 10px; }
  .grow .sku { font-family: var(--mono); color: var(--muted); font-size: 10px; }
  .grow .tm { font-family: var(--mono); color: var(--faint); font-size: 9.5px; }
  /* design 1a on the phone (owner 2026-10-08 "make the mobile version
     updated"): three counts, the needs-attention queue, Sold today */
  .counts { display: flex; align-items: baseline; gap: 18px; padding: 2px 2px 12px; flex-wrap: wrap; }
  .counts > div { display: flex; align-items: baseline; gap: 6px; }
  .counts .n { font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .counts .n.r { color: var(--neg); } .counts .n.a { color: var(--amber); } .counts .n.b { color: #1D4ED8; }
  .counts .l { font-size: 12px; color: var(--text); }
  .qload { padding: 2px 2px 12px; }
  .qload .t { font-size: 13px; font-weight: 500; }
  .qload .d { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 6px; }
  .qtrack { height: 4px; border-radius: 2px; background: #EAE8E3; margin-top: 8px; overflow: hidden; }
  .qfill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 400ms ease; }
  .qcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .qhead { display: flex; align-items: center; padding: 11px 14px; gap: 8px; }
  .qhead .sub { margin-left: auto; font-size: 10px; color: var(--faint); text-align: right; }
  .qrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 10px 14px; border-top: 1px solid #F0EFEC; }
  .qrow.open { background: #FBFBFA; }
  .qbadge { display: inline-block; font-size: 9.5px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
  .qbadge.out { background: var(--neg-bg); color: var(--neg); } .qbadge.low { background: var(--amber-bg); color: var(--amber); } .qbadge.fast { background: #DBEAFE; color: #1D4ED8; } .qbadge.watch { background: #EFEEEA; color: var(--muted); }
  .qsku { font-family: var(--mono); font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qhot { display: inline-block; margin-left: 5px; padding: 0 5px; border-radius: 4px; background: #FCEADF; color: #B4501B; font-size: 9px; font-weight: 600; vertical-align: 1px; }
  .qtitle { color: var(--faint); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .qph { font-size: 11.5px; text-align: right; white-space: nowrap; }
  .qpanel { display: none; background: #FBFBFA; border-top: 1px solid #F0EFEC; padding: 10px 14px 12px; }
  .qrow.open + .qpanel { display: block; }
  .qstats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }
  .qstats .k { font-size: 8.5px; }
  .qstats .v { font-family: var(--mono); font-size: 15px; font-weight: 600; margin-top: 2px; }
  .qstats .v.up { color: #1D4ED8; }
  .qsplit { display: flex; gap: 12px; margin-top: 10px; font-size: 10.5px; color: var(--muted); }
  .qsplit b { font-family: var(--mono); color: var(--text); }
  .qsplit i { display: inline-block; width: 6px; height: 6px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
  .qsplit .walmart i { background: #2E86D9; } .qsplit .ebay i { background: #047857; } .qsplit .temu i { background: #C97B12; }
  .qopen { margin-top: 10px; font-size: 11px; color: var(--accent); font-weight: 600; }
  .qfoot { padding: 9px 14px; border-top: 1px solid #F0EFEC; font-size: 11px; color: var(--accent); font-weight: 600; }
  .qnote { padding: 14px; font-size: 11.5px; color: var(--muted); border-top: 1px solid #F0EFEC; }
  .sold-top { padding: 12px 14px 12px; }
  .sold-n { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
  .sold-n b { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1; }
  .sold-n span { color: var(--muted); font-size: 12px; }
  .sold-m { display: flex; align-items: center; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 11px; flex-wrap: wrap; }
  .sold-m b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .chip { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: #065F46; }
  .chip.dn { background: var(--neg-bg); color: var(--neg); }
  .share { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 11px; gap: 2px; }
  .share i { display: block; height: 100%; }
  .share .walmart, .legend .walmart i { background: #2E86D9; } .share .ebay, .legend .ebay i { background: #047857; } .share .temu, .legend .temu i { background: #C97B12; }
  .legend { display: flex; gap: 12px; margin-top: 7px; font-size: 10.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 6px; height: 6px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
  .legend b { font-family: var(--mono); color: var(--text); }
  .sold-h, .sold-row, .sold-tot { display: grid; grid-template-columns: 20px minmax(0, 1fr) 40px; gap: 6px; padding: 5px 14px; }
  .sold-h { background: #F4F3F0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 8.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .sold-row { font-family: var(--mono); font-size: 11px; }
  .sold-row .i { color: var(--faint); } .sold-row .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sold-h .u, .sold-row .u, .sold-tot .u { text-align: right; }
  .sold-tot { padding: 7px 14px 9px; border-top: 1px solid var(--border); font-size: 11px; font-weight: 600; }
  .sold-more { padding: 8px 14px; border-top: 1px solid #F0EFEC; font-size: 11px; color: var(--accent); font-weight: 600; text-align: center; }
  .sec { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 14px 2px 8px; }
  .err { text-align: center; color: var(--neg); font-size: 12px; padding: 30px 10px; }
  .quiet { text-align: center; color: var(--faint); font-size: 11px; padding: 24px 10px; }
  .stale { text-align: center; color: var(--faint); font-size: 10px; margin-top: 4px; }
  .olist { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .orow { padding: 9px 12px; border-bottom: 1px solid #F0EFEC; }
  .orow:last-child { border-bottom: none; }
  .og { display: flex; align-items: center; gap: 9px; }
  .oc { flex: 1; min-width: 0; }
  .othumb { width: 30px; height: 30px; border-radius: 6px; object-fit: contain; border: 1px solid var(--line); background: #FAFAF8; flex: none; }
  span.othumb { display: block; }
  .odetail .othumb { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; }
  .orow .top { display: flex; align-items: center; gap: 7px; }
  .odot { width: 6px; height: 6px; border-radius: 999px; background: var(--faint); flex: none; }
  .odot.walmart { background: #2E86D9; } .odot.ebay { background: #047857; } .odot.temu { background: #C97B12; }
  .opo { font-family: var(--mono); font-size: 11.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ochip { margin-left: auto; font-size: 8.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; flex: none; }
  .ochip.done { background: var(--accent-soft); color: #065F46; }
  .ochip.pending { background: var(--amber-bg); color: var(--amber); }
  .ochip.failed { background: var(--neg-bg); color: var(--neg); }
  .ochip.charge { background: #F4F3F0; color: var(--muted); font-family: var(--mono); }
  .orow .sub { display: flex; gap: 8px; color: var(--muted); font-size: 10.5px; padding-left: 13px; margin-top: 2px; font-family: var(--mono); }
  .orow .sub .t { margin-left: auto; color: var(--faint); font-size: 10px; flex: none; }
  .orow .sub span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .odetail { margin: 8px 0 2px 13px; padding: 8px 10px; background: #FAFAF8; border: 1px solid var(--line); border-radius: 8px; font-size: 10.5px; display: none; }
  .orow.open .odetail { display: block; }
  .odetail div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .odetail .lbl { color: var(--faint); flex: none; }
  .odetail .val { font-family: var(--mono); text-align: right; word-break: break-all; }
  .search { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; margin-bottom: 8px; }
  .search input { border: none; outline: none; background: none; font-family: inherit; font-size: 13px; width: 100%; color: var(--text); }
  .chips { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .chips button { font-family: inherit; font-size: 10.5px; font-weight: 600; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 999px; padding: 3px 11px; }
  .chips button.on { background: var(--surface); border-color: var(--border); color: var(--text); }
  .chips button.low { color: var(--neg); }
  .chips button.low.on { background: var(--neg-bg); border-color: transparent; }
  .slist { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .srow { padding: 8px 12px; border-bottom: 1px solid #F0EFEC; display: flex; align-items: center; gap: 10px; }
  .srow:last-child { border-bottom: none; }
  .srow.low { background: #FDF6F6; }
  .srow .info { min-width: 0; }
  .ssku { font-family: var(--mono); font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .smeta { color: var(--faint); font-size: 9.5px; margin-top: 1px; }
  .smeta.warn { color: var(--neg); }
  .snum { margin-left: auto; text-align: right; flex: none; }
  .snum .n { font-family: var(--mono); font-size: 14px; font-weight: 700; }
  .snum .n.low { color: var(--neg); }
  .snum .l { color: var(--faint); font-size: 8.5px; }
  .sedit { display: none; padding: 8px 12px 10px; background: #FAFAF8; border-bottom: 1px solid #F0EFEC; }
  .sedit.show { display: flex; gap: 8px; align-items: center; }
  .sedit label { font-size: 10.5px; color: var(--muted); flex: none; }
  .sedit input { width: 90px; font-family: var(--mono); font-size: 14px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; outline-color: var(--accent); }
  .sedit button { font-family: inherit; font-size: 11px; font-weight: 600; border-radius: 8px; padding: 7px 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .sedit button.save { background: #065F46; border-color: #065F46; color: #fff; }
  .sedit .msg { font-size: 10px; color: var(--neg); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid #D8D6D0; display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  .tabs button { font-family: inherit; font-size: 11.5px; font-weight: 600; color: var(--faint); background: none; border: none; padding: 4px 0; }
  .tabs button.on { color: var(--accent); }
  .page { display: none; }
  .page.on { display: block; }
  /* tab switches fade the incoming page in — the same 180ms opacity fade the
     desktop tabs use (owner request 2026-08-17) */
  .page.fadein { animation: pageFade 180ms cubic-bezier(.2, .7, .3, 1); }
  @keyframes pageFade { from { opacity: 0; } }
</style>
</head>
<body>
  <div id="ptr">Pull to refresh</div>
  <div id="pgOverview" class="page on">
    <div class="head"><h1>Overview</h1><span class="date" id="date"></span>
      <span class="seg aseg" id="sizeSeg" title="Text size">
        <button data-s="1" class="a1 on">A</button><button data-s="1.15" class="a2">A</button><button data-s="1.3" class="a3">A</button>
      </span>
    </div>
    <div id="counts" class="counts"></div>
    <div class="qcard" id="queue"><div class="qhead"><span class="k">Needs attention</span></div><div class="quiet">Loading…</div></div>
    <div class="qcard" id="soldcard"><div class="sold-top"><span class="k">Sold today</span><div class="quiet">Loading…</div></div></div>
    <div class="sec">Sales</div>
    <div class="toggles">
      <span class="seg" id="metricSeg"><button data-m="sales" class="on">Gross $</button><button data-m="orders">Orders</button></span>
      <span class="seg" id="rangeSeg" style="margin-left:auto"><button data-r="Day" class="on">Day</button><button data-r="Month">Month</button><button data-r="Year">Year</button></span>
    </div>
    <div class="panel" id="card"><div class="quiet">Loading…</div></div>
    <div class="panel"><span class="k" id="chartLabel">Sales</span><div id="chart"></div></div>
    <div class="panel"><span class="k">Latest orders</span><div class="grid" id="feed"></div></div>
    <div class="stale" id="stamp"></div>
  </div>

  <div id="pgOrders" class="page">
    <div class="head"><h1>Orders</h1></div>
    <div class="toggles"><span class="seg wide" id="obSeg">
      <button data-b="today" class="on">Today</button><button data-b="open">Open book</button>
    </span></div>
    <div class="olist" id="olist"><div class="quiet">Loading…</div></div>
    <div class="stale">tap an order for items, tracking and notes</div>
  </div>

  <div id="pgStock" class="page">
    <div class="head"><h1>Stock</h1></div>
    <div class="search"><input id="sq" type="search" placeholder="Search SKU or title" autocomplete="off" /></div>
    <div class="chips" id="schips">
      <button data-c="all" class="on">All</button>
      <button data-c="wfs">WFS</button>
      <button data-c="ds">DropShip</button>
      <button data-c="low" class="low">Low</button>
    </div>
    <div class="slist" id="slist"><div class="quiet">Loading…</div></div>
    <div class="stale">tap a row to correct the warehouse count</div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-p="Overview" class="on">Overview</button>
    <button data-p="Orders">Orders</button>
    <button data-p="Stock">Stock</button>
  </nav>

<script>
  let data = null, range = 'Day', metric = 'sales';
  let ordersData = null, obView = 'today';
  let stockData = null, sview = 'all', activeTab = 'Overview', editSku = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money$ = (v) => '$' + Math.round(v).toLocaleString('en-US');
  const short$ = (v) => v >= 100000 ? '$' + Math.round(v / 1000) + 'k' : v >= 10000 ? '$' + (v / 1000).toFixed(1) + 'k' : money$(v);
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const CHN = { walmart: 'Walmart', ebay: 'eBay', temu: 'Temu' };
  const tf = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const h = d.getHours();
    return (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + (h < 12 ? 'a' : 'p');
  };
  const df = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const today = new Date();
    return d.toDateString() === today.toDateString() ? tf(iso) : MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate();
  };

  /* ---------------- Overview (unchanged from the first phone page) ---------------- */
  function renderCard() {
    const t = data && data.orders && data.orders.today;
    if (!t) { $('card').innerHTML = '<div class="err">No data yet — is DWS Stock running?</div>'; return; }
    const isMoney = metric === 'sales' && t.totalSales !== undefined;
    const now = new Date();
    const view = range === 'Day' ? t : ((data.orders.ranges || {})[range] || null);
    const label = (isMoney ? 'Gross ' : 'Orders ') + (range === 'Day' ? 'today' : range === 'Month' ? '· ' + MONTHS[now.getMonth()] : '· 12 months');
    if (!view) { $('card').innerHTML = '<div class="k">' + label + '</div><div class="big">…</div>'; return; }
    const prev = range === 'Day' ? { t: t.yesterday, s: t.yesterdaySales || 0, vs: 'vs yesterday' }
      : range === 'Month' && view.prevTotal !== undefined ? { t: view.prevTotal, s: view.prevTotalSales || 0, vs: 'vs ' + MONTHS[(now.getMonth() + 11) % 12].slice(0, 3) + ' 1–' + now.getDate() }
      : null;
    const delta = prev ? (isMoney ? view.totalSales - prev.s : view.total - prev.t) : null;
    const dHtml = prev
      ? '<div class="delta ' + (delta < 0 ? 'neg' : '') + '">' + (delta >= 0 ? '▲ +' : '▼ −') + (isMoney ? '$' : '') + Math.abs(delta).toLocaleString('en-US') + ' ' + prev.vs + '</div>'
      : '<div class="delta"></div>';

    $('card').innerHTML = '<div class="k">' + label + '</div>'
      + '<div class="big">' + (isMoney ? money$(view.totalSales) : view.total.toLocaleString('en-US')) + '</div>' + dHtml
      + '<div class="chans">' + ['walmart','ebay','temu'].map(k =>
          '<div><div class="cn ' + k + '">' + CHN[k] + '</div><div class="cv">' + cv(k) + '</div></div>').join('') + '</div>';
  }
  function smooth(pts) {
    let d = 'M ' + pts[0][0] + ',' + pts[0][1];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ' C ' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ',' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)
        + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ',' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)
        + ' ' + p2[0] + ',' + p2[1];
    }
    return d;
  }
  function renderChart() {
    const s = data && data.orders && data.orders.series && data.orders.series[range];
    $('chartLabel').textContent = 'Sales · ' + (metric === 'sales' ? 'gross $' : 'orders') + ' · ' + range.toLowerCase();
    if (!s || s.vals.length < 2) { $('chart').innerHTML = ''; return; }
    const vals = metric === 'sales' && Array.isArray(s.sales) ? s.sales : s.vals;
    const W = 480, H = 150, padL = 40, padR = 40, padT = 12, padB = 18;
    const iw = W - padL - padR, ih = H - padT - padB;
    const rawMax = Math.max(1, ...vals) * 2;
    const unit = Math.pow(10, Math.floor(Math.log10(rawMax))) / 2;
    const max = Math.ceil(rawMax / unit) * unit;
    const X = (i) => Math.round(padL + (i / (vals.length - 1)) * iw);
    const Y = (v) => Math.round(padT + ih - (v / max) * ih);
    const pts = vals.map((v, i) => [X(i), Y(v)]);
    const line = smooth(pts);
    const area = line + ' L ' + pts[pts.length - 1][0] + ',' + (padT + ih) + ' L ' + pts[0][0] + ',' + (padT + ih) + ' Z';
    const fmt = (v) => metric === 'sales' ? short$(v) : String(v);
    let out = '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#047857" stop-opacity=".16"/><stop offset="100%" stop-color="#047857" stop-opacity="0"/></linearGradient></defs>';
    [0, .5, 1].forEach(f => {
      const v = Math.round(max * f), y = Y(v);
      out += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#F0EFEC"/>'
        + '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" font-size="8.5" fill="#A5A29C" text-anchor="end">' + fmt(v) + '</text>';
    });
    out += '<path d="' + area + '" fill="url(#g)"/><path d="' + line + '" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>';
    const last = pts[pts.length - 1];
    out += '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="#047857"/>'
      + '<text x="' + (last[0] + 6) + '" y="' + (last[1] + 3) + '" font-size="9" font-weight="700" fill="#047857">'
      + (metric === 'sales' ? short$(vals[vals.length - 1]) : vals[vals.length - 1].toLocaleString('en-US')) + '</text>';
    const tips = s.tips;
    const lab = (i) => '<text x="' + X(i) + '" y="' + (H - 4) + '" font-size="8" fill="#A5A29C" text-anchor="middle">' + tips[i] + '</text>';
    out += lab(0) + lab(tips.length - 1);
    $('chart').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '">' + out + '</svg>';
  }
  function renderFeed() {
    const feed = (data && data.orders && data.orders.recent) || [];
    if (!feed.length) { $('feed').innerHTML = ''; return; }
    $('feed').innerHTML = '<div class="ghead"><span>PO#</span><span>SKU</span><span>Time</span></div>'

        + esc(r.sku || '—') + (r.more ? ' +' + r.more : '') + '</span><span class="tm">' + tf(r.at) + '</span></div>').join('');
  }
  /* ---- design 1a: counts, the queue, Sold today (same /data as the desktop) ---- */
  let qOpen = null, qWatch = false, soldAll = false;
  const MK = [['walmart', 'Walmart'], ['ebay', 'eBay'], ['temu', 'Temu']];
  const n$ = (v) => (Number(v) || 0).toLocaleString('en-US');
  const plan = () => data && data.stockPlan;
  const loading = () => !!(data && !data.money && data.moneyPending);
  const clear = () => { const p = plan(); return !!(p && p.ready && !p.counts.out && !p.counts.low); };
  function phrase(r) {
    if (r.kind === 'out') return r.last ? 'Out since ' + esc(r.last) : 'Out of stock';
    if (r.kind === 'fast') return 'Up ' + r.pct + '%';

  }
  function renderCounts() {
    const box = $('counts');

    if (loading()) {

      box.innerHTML = '<div class="qload"><span class="t">' + head + '…</span><span class="d">' + esc(mp.detail || '') + '</span><div class="qtrack"><div class="qfill" style="width:' + Math.round(Math.max(.02, Math.min(1, mp.frac || 0)) * 100) + '%"></div></div></div>';

  function rowHtml(r, hotAt) {
    const badge = { out: 'Out', low: 'Low', fast: 'Fast', watch: 'Watch' }[r.kind];

      + '<div><div class="k">30 days</div><div class="v">' + n$(r.sold30) + '</div></div>'

      + '<div><div class="k">Pace</div><div class="v' + (r.pct > 0 ? ' up' : '') + '">' + (r.pct > 0 ? '+' : '') + r.pct + '%</div></div>'
      + '<div><div class="k">' + (r.avail + r.atWfs > 0 ? 'Days left' : 'Order') + '</div><div class="v">' + (r.avail + r.atWfs > 0 ? r.daysLeft : n$(r.order)) + '</div></div>'
      + '</div><div class="qsplit">' + MK.map(([k, nm]) => '<span class="' + k + '"><i></i>' + nm + ' <b>' + n$(split[k]) + '</b>' + (tot ? ' ' + Math.round((split[k] || 0) / tot * 100) + '%' : '') + '</span>').join('') + '</div>'
      + '<div class="qopen" data-qstock="' + esc(r.sku) + '">Open in Stock →</div></div>';
  }
  function renderQueue() {
    const box = $('queue');
    const p = plan();
    const lead = (p && p.leadDays) || 7, cover = (p && p.coverDays) || 21;
    const label = loading() ? 'Getting stock levels ready' : clear() ? 'Selling fast — no action needed' : 'Needs attention';
    const head = '<div class="qhead"><span class="k">' + label + '</span><span class="sub">lead ' + lead + 'd · target ' + (lead + cover) + 'd</span></div>';
    if (!data || loading() || !p || !p.ready) { box.innerHTML = head + '<div class="qnote">' + (loading() ? 'This read happens once per station; after that stock levels refresh every 10 minutes.' : 'Stock levels will show here once Linnworks answers.') + '</div>'; return; }
    const watch = p.watch || [];
    const rows = [...(clear() ? p.rows.filter(r => r.kind === 'fast') : p.rows), ...(qWatch ? watch : [])];
    if (qOpen && !rows.some(r => r.sku === qOpen)) qOpen = null;
    const list = rows.length ? rows.map(r => rowHtml(r, p.hotAt || 1)).join('') : '<div class="qnote">' + (clear() ? 'Nothing is selling faster than usual either.' : 'Nothing needs attention.') + '</div>';
    const foot = watch.length ? '<div class="qfoot" data-qwatch>' + (qWatch ? 'Hide the ' + watch.length + ' under ' + (lead + cover) + ' days of cover' : watch.length + ' more under ' + (lead + cover) + ' days of cover →') + '</div>' : '';

  function renderSold() {
    const box = $('soldcard');

    const t = data && data.orders && data.orders.today;
    const head = '<div class="sold-top"><span class="k">Sold today</span>';
    if (!sold) { box.innerHTML = head + '<div class="qnote" style="border:0;padding:8px 0 0">' + (!data ? 'Loading…' : data.livePending ? 'Reading today’s orders…' : 'Could not reach Linnworks for today’s orders.') + '</div></div>'; return; }
    const by = sold.byChannel || {};
    const tot = MK.reduce((a, [k]) => a + (by[k] || 0), 0);

    const chip = yd === null ? '' : '<span class="chip' + (yd < 0 ? ' dn' : '') + '">' + (yd > 0 ? '+' : yd < 0 ? '−' : '') + Math.abs(yd) + ' vs yesterday</span>';
    const rows = soldAll ? sold.rows : sold.rows.slice(0, 12);
    box.innerHTML = head
      + '<div class="sold-n"><b>' + n$(sold.units) + '</b><span>units</span></div>'

      + '<div class="share">' + MK.map(([k]) => '<i class="' + k + '" style="width:' + (tot ? (by[k] || 0) / tot * 100 : 0) + '%"></i>').join('') + '</div>'
      + '<div class="legend">' + MK.map(([k, nm]) => '<span class="' + k + '"><i></i>' + nm + ' <b>' + n$(by[k]) + '</b></span>').join('') + '</div></div>'
      + '<div class="sold-h"><span>#</span><span>SKU</span><span class="u">Units</span></div>'
      + (rows.length ? rows.map((r, i) => '<div class="sold-row"><span class="i">' + (i + 1) + '</span><span class="s"' + (r.unmapped ? ' style="color:var(--amber)"' : ' data-qstock="' + esc(r.sku) + '"') + '>' + (r.unmapped ? '⚠ ' : '') + esc(r.sku) + '</span><span class="u">' + r.units + '</span></div>').join('') : '<div class="qnote">Nothing sold yet today.</div>')

  function openStock(sku) {

  $('pgOverview').addEventListener('click', (e) => {

  function renderOverview() { renderCounts(); renderQueue(); renderSold(); renderCard(); renderChart(); renderFeed(); }

  /* ---------------- Orders ---------------- */
  function renderOrders() {
    const box = $('olist');

      ? '<span class="ochip charge">' + money$(r.charge || 0) + '</span>'

  /* ---------------- Stock ---------------- */
  function stockRows() {
    if (!stockData || !stockData.ok) return [];
    const q = $('sq').value.trim().toLowerCase();
    return stockData.items.filter(it => {
      if (sview === 'wfs' && !(it.wfs > 0)) return false;
      if (sview === 'ds' && !it.ds) return false;
      if (sview === 'low' && !(it.min > 0 && it.avail < it.min)) return false;
      if (q && !(it.sku.toLowerCase().includes(q) || it.title.toLowerCase().includes(q))) return false;
      return true;
    });
  }
  function renderStock() {
    const box = $('slist');
    if (!stockData) { box.innerHTML = '<div class="quiet">Loading…</div>'; return; }
    if (!stockData.ok) { box.innerHTML = '<div class="err">' + esc(stockData.error || 'Stock unavailable.') + '</div>'; return; }
    const lowN = stockData.items.filter(it => it.min > 0 && it.avail < it.min).length;
    const lowBtn = $('schips').querySelector('[data-c="low"]');

          : (it.min ? 'min ' + it.min : 'no minimum') + (it.inOrders ? ' · ' + it.inOrders + ' in orders' : '');

  $('schips').addEventListener('click', (e) => {

  $('slist').addEventListener('click', async (e) => {
    const ed = e.target.closest('.sedit');

      const sku = ed.dataset.editfor;
      const input = ed.querySelector('input');
      const msg = ed.querySelector('.msg');
      if (e.target.closest('.cancel')) { editSku = null; renderStock(); return; }
      if (e.target.closest('.save')) {
        const n = Number(input.value);
        if (!Number.isInteger(n) || n < 0) { msg.textContent = 'Whole number, 0 or more.'; return; }
        const isDs = ed.dataset.ds === '1'; // dropship SKUs edit their PAD, not the shelf
        msg.textContent = '';
        e.target.textContent = 'Saving…';
        try {
          const r = await fetch((isDs ? '/pad/set' : '/stock/set') + location.search, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sku, level: n }),
          });
          const j = await r.json();
          if (!j.ok) { e.target.textContent = 'Save'; msg.textContent = j.error || 'Could not save.'; return; }
          const it = stockData.items.find(x => x.sku === sku);
          if (it) {
            if (isDs) {
              it.pad = n;
            } else {
              it.level = Number(j.stockLevel ?? n);
              it.inOrders = Number(j.inOrders ?? it.inOrders);
              it.avail = Number(j.available ?? Math.max(0, it.level - it.inOrders));
            }
          }
          editSku = null;

  /* ---------------- tabs + refresh ---------------- */
  function showTab(p) {
    const switching = activeTab !== p;

    $('pgOverview').classList.toggle('on', p === 'Overview');
    $('pgOrders').classList.toggle('on', p === 'Orders');
    $('pgStock').classList.toggle('on', p === 'Stock');

    if (switching) {
      const el = $('pg' + p);
      el.classList.remove('fadein');
      void el.offsetWidth; // restart the animation
      el.classList.add('fadein');

    if (p === 'Orders' && !ordersData) refreshOrders();
    if (p === 'Stock' && !stockData) refreshStock();

  let soonTimer = null;
  async function refreshOverview() {
    try {
      const r = await fetch('/data' + location.search, { cache: 'no-store' });
      const j = await r.json();
      if (j && j.ok) {
        data = j; renderOverview(); $('stamp').textContent = 'updated ' + new Date().toLocaleTimeString();
        // the desktop is still reading sales or today's orders: ask again soon
        if ((j.moneyPending || j.livePending) && activeTab === 'Overview') { clearTimeout(soonTimer); soonTimer = setTimeout(refreshOverview, 3000); }
      }
      else if (!data) $('card').innerHTML = '<div class="err">' + esc((j && j.error) || 'No data.') + '</div>';
    } catch {
      if (!data) $('card').innerHTML = '<div class="err">Can’t reach DWS Stock — is Tailscale on, and the app running?</div>';
      else $('stamp').textContent = 'connection lost — retrying…';
    }
  }
  async function refreshOrders() {
    try {
      const r = await fetch('/orders' + location.search, { cache: 'no-store' });
      ordersData = await r.json();
    } catch { if (!ordersData) ordersData = { ok: false, error: 'Can’t reach DWS Stock.' }; }
    if (activeTab === 'Orders') renderOrders();
  }
  async function refreshStock(fresh) {
    try {
      const r = await fetch('/stock' + location.search + (fresh ? '&fresh=1' : ''), { cache: 'no-store' });
      const j = await r.json();
      if (!editSku || !j.ok) stockData = j; // never yank an edit out from under a thumb
    } catch { if (!stockData) stockData = { ok: false, error: 'Can’t reach DWS Stock.' }; }
    if (activeTab === 'Stock' && !editSku) renderStock();
  }

  // pull-to-refresh (owner request 2026-08-17): drag down from the top of
  // any tab; past the threshold, release refreshes that tab
  let ptrY = null, ptrArmed = false, ptrBusy = false;
  window.addEventListener('touchstart', (e) => {
    if (ptrBusy) return;
    ptrY = window.scrollY <= 0 ? e.touches[0].clientY : null;
    ptrArmed = false;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (ptrY == null || ptrBusy) return;
    const dy = e.touches[0].clientY - ptrY;
    if (dy > 14 && window.scrollY <= 0) {
      ptrArmed = dy > 70;
      $('ptr').textContent = ptrArmed ? 'Release to refresh' : 'Pull to refresh';
      $('ptr').classList.add('show');
    } else {
      $('ptr').classList.remove('show');
      ptrArmed = false;
    }
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (ptrY == null) return;
    ptrY = null;
    if (!ptrArmed || ptrBusy) { $('ptr').classList.remove('show'); return; }
    ptrBusy = true;
    $('ptr').textContent = 'Refreshing…';
    try {
      if (activeTab === 'Overview') await refreshOverview();
      else if (activeTab === 'Orders') await refreshOrders();
      else { editSku = null; await refreshStock(true); }
    } finally {
      ptrBusy = false;
      ptrArmed = false;
      $('ptr').textContent = 'Updated';
      setTimeout(() => $('ptr').classList.remove('show'), 700);
    }
  });

  // text size: Small (default) / Medium / Large — one zoom on the whole app,
  // remembered on this phone (owner request 2026-08-17)
  function applySize(v) {
    document.body.style.zoom = v;
    [...$('sizeSeg').children].forEach(b => b.classList.toggle('on', b.dataset.s === v));
  }
  $('sizeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    applySize(b.dataset.s);
    try { localStorage.setItem('phoneTextSize', b.dataset.s); } catch { /* private mode */ }
  });
  try { applySize(localStorage.getItem('phoneTextSize') || '1'); } catch { applySize('1'); }

  const d = new Date();
  $('date').textContent = WDAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  $('metricSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    metric = b.dataset.m;
    [...$('metricSeg').children].forEach(x => x.classList.toggle('on', x === b));
    renderOverview();
  });
  $('rangeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    range = b.dataset.r;
    [...$('rangeSeg').children].forEach(x => x.classList.toggle('on', x === b));
    renderOverview();
  });
  refreshOverview();
  setInterval(() => {
    if (activeTab === 'Overview') refreshOverview();
    else if (activeTab === 'Orders') refreshOrders();
    else refreshStock();
  }, 60000);
</script>
</body>
</html>
