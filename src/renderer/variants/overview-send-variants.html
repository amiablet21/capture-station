<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Overview — Send to WFS column, three looks (pick one)</title>
<!--
  Owner 2026-09-23: "make the send visual a little different". The built
  Overview (v1.28.1) is Sold today | Send to WFS | Running low; only the
  middle column changes here. Same data, same behaviour (Send opens the
  pre-filled WFS Shipments dialog, Ignore hides 7 days, Mark received).
    S1 · Sheet     - the Send list as the same Excel-style grid as Sold today
    S2 · Cards     - one card per SKU, big "+58", full-width Send button
    S3 · Checklist - tick SKUs, one "Send selected" builds ONE shipment with
                     every ticked line (a real WFS shipment carries many SKUs)
  Built on the real styles.css; the only new CSS is the "sv-" block below.
-->
<link rel="stylesheet" href="../styles.css" />
<style>
  .sv-pick { display: flex; align-items: center; gap: 8px; }
  .sv-pick .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .sv-pick .ov-ranges { margin-left: 0; display: flex; background: #EFEEEA; border-radius: 8px; padding: 2px; gap: 2px; }
  .sv-pick .ov-rbtn { font-size: 10px; font-weight: 600; color: var(--muted); padding: 2px 10px; border-radius: 6px; border: none; background: transparent; font-family: var(--font); cursor: pointer; }
  .sv-pick .ov-rbtn.is-on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(47, 52, 55, 0.08); }

  /* S1 · sheet: the Send list as an Excel grid, actions in the last cell */
  .sv-grid .ov-xhead, .sv-grid .ov-feedrow { grid-template-columns: minmax(0, 1fr) 30px 46px 36px 40px 80px; }
  .sv-grid .ov-feedrow { align-items: center; }
  .sv-grid .ov-feedrow span { padding: 5px 6px; }
  .sv-grid .n { text-align: right; font-family: var(--mono); }
  .sv-grid .xrn { color: var(--faint); text-align: center; background: #F4F3F0; font-family: var(--mono); font-size: 9.5px; align-self: stretch; }
  .sv-grid .xsku { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--badge-blue-text); }
  .sv-grid .xsku small { display: block; font-weight: 400; color: var(--faint); font-size: 9.5px; }
  .sv-grid .days.r { color: var(--neg-text); font-weight: 700; } .sv-grid .days.a { color: var(--badge-yellow-text); font-weight: 700; } .sv-grid .days.g { color: var(--accent); font-weight: 700; }
  .sv-grid .send { font-weight: 700; }
  .sv-grid .acts { display: flex; gap: 2px; align-items: center; justify-content: flex-end; overflow: visible; }
  .sv-grid .acts .btn { font-size: 11px; padding: 1px 9px; }
  .sv-grid .ov-feedrow:hover { background: var(--surface-2); }

  /* S2 · cards: one per SKU, the send number is the hero */
  .sv-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface); }
  .sv-card.r { border-left: 3px solid var(--neg-text); } .sv-card.a { border-left: 3px solid var(--badge-yellow-text); } .sv-card.g { border-left: 3px solid var(--accent); }
  .sv-card .top { display: flex; align-items: flex-start; gap: 10px; }
  .sv-card .top .l { flex: 1; min-width: 0; }
  .sv-card .num { text-align: right; }
  .sv-card .num b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 700; line-height: 1.1; color: #065F46; }
  .sv-card .num span { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .sv-card .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .sv-card .stats div { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .sv-card .stats b { display: block; font-family: var(--mono); font-size: 13px; color: var(--text); letter-spacing: 0; }
  .sv-card .stats b.r { color: var(--neg-text); } .sv-card .stats b.a { color: var(--badge-yellow-text); }
  .sv-card .row { display: flex; align-items: center; gap: 10px; }
  .sv-card .row .btn-primary { flex: 1; font-size: 12px; padding: 5px 10px; }
  .sv-card .row a { font-size: 11.5px; color: var(--muted); cursor: pointer; }

  /* S3 · checklist: tick rows, one shipment for all of them */
  .sv-bar { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .sv-bar .t { font-size: 11.5px; color: var(--accent-soft-text); }
  .sv-bar .t b { font-family: var(--mono); }
  .sv-bar .btn { margin-left: auto; font-size: 12px; padding: 4px 12px; }
  .sv-check td:first-child { width: 22px; padding-top: 9px; }
  .sv-check input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .sv-check tr.off td { opacity: .55; }
  .sv-qty { width: 52px; font-family: var(--mono); font-size: 12px; font-weight: 700; text-align: right; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; background: var(--surface); color: var(--text); }
  .sv-x { border: none; background: none; color: var(--faint); cursor: pointer; font-size: 11px; margin-left: 4px; }
  .sv-x:hover { color: var(--neg-text); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="sv-pick"><span class="lbl">Send look</span>
        <span class="ov-ranges" id="pick">
          <button class="ov-rbtn is-on" data-v="s1">S1</button>
          <button class="ov-rbtn" data-v="s2">S2</button>
          <button class="ov-rbtn" data-v="s3">S3</button>
        </span>
      </span>
    </div>
    <nav class="tabs">
      <button class="tab is-active">Overview</button><button class="tab">Capture</button><button class="tab">Stock</button>
      <button class="tab">Returns <span class="tab-caret">▾</span></button><button class="tab">Listings</button>
    </nav>
    <div class="topbar-right"></div>
  </header>
  <section class="ov-page">
    <div class="ov-sheet-row">
      <div class="ov-wrap">
        <div class="ov-head"><h1>Overview</h1><span class="ov-date">Wednesday, September 23</span>
          <button class="btn btn-ghost ov-refresh">Refresh</button><button class="btn btn-ghost ov-phone">Phone</button></div>
        <div class="ov-cols">
          <div class="ov-panel ov-today ov-sold" id="sold"></div>
          <div class="ov-panel" id="wfs"></div>
          <div class="ov-panel" id="low"></div>
        </div>
      </div>
      <div class="sheet-grip"></div>
    </div>
  </section>
  <footer class="footbar"><div class="footbar-left"></div><div class="footbar-right"><span class="sync-status">Last sync 9:14 AM</span><button class="btn btn-ghost">History</button></div></footer>

<script>
const ROWS = [
  { sku: 'X400-128GB-GRAY', ch: 'WM-X400-128-GRY', wk: 42, atWfs: 6, onWay: 0, days: 1.0, send: 58 },
  { sku: 'S24-FE-128GB-BLACK', ch: 'WM-S24FE-128-BLK', wk: 21, atWfs: 4, onWay: 0, days: 1.3, send: 17 },
  { sku: 'BUDS-3-WHITE', ch: '', wk: 35, atWfs: 9, onWay: 0, days: 1.8, send: 40 },
  { sku: 'X520-256GB-SILVER', ch: 'WM-X520-256-SLV', wk: 18, atWfs: 12, onWay: 10, days: 8.6, send: 33 },
  { sku: 'SM-X133-64GB-GREY', ch: 'WM-X133-64-GRY', wk: 14, atWfs: 11, onWay: 0, days: 5.5, send: 26 },
];
const FLIGHT = [
  { sku: 'X620-128GB-SILVER', more: 0, when: '40 sent Sep 20 · SHIP-88213', st: ['status-pending', 'Pending'] },
  { sku: 'BUDS-2-GRAPHITE', more: 1, when: 'sent Sep 6 · check Seller Center', st: ['badge-parked', 'Check'] },
  { sku: 'X730-512GB-GRAY', more: 0, when: '24 sent Sep 13', st: ['status-synced', 'Received'], done: true },
];
const SOLD = [['X400-128GB-GRAY', 9], ['BUDS-3-WHITE', 7], ['X520-128GB-SILVER', 5], ['S24-FE-128GB-BLACK', 4], ['BUDS-2-GRAPHITE', 4], ['X230-256GB-GRAY', 3], ['SM-X133-64GB-GREY', 3], ['X620-128GB-SILVER', 2], ['X730-512GB-GRAY', 2], ['TABA9+64GB', 2], ['X400-256GB-SILVER', 1], ['SGTT220GRAY', 1]];
const tone = d => d < 5 ? 'r' : d < 10 ? 'a' : 'g';
let picked = new Set(ROWS.filter(r => r.days < 5).map(r => r.sku));

// the untouched side columns, as built in v1.28.1
document.getElementById('sold').innerHTML = `
  <div><div class="k">Units sold today</div><div class="big mono">43</div><div class="delta">38 orders · 12 SKUs</div></div>
  <div class="ov-xgrid ov-soldgrid"><div class="ov-xhead"><span class="xrn">#</span><span>SKU</span><span>Units</span></div>
  ${SOLD.map(([s, u], i) => `<div class="ov-feedrow"><span class="xrn">${i + 1}</span><span class="xsku">${s}</span><span class="xu">${u}</span></div>`).join('')}
  <div class="ov-feedrow tot"><span class="xrn"></span><span>Total · 12 SKUs</span><span class="xu">43</span></div></div>
  <div class="ov-chcells"><div class="ov-chcell"><div class="cn cn-walmart">Walmart</div><div class="cv">24</div></div><div class="ov-chcell"><div class="cn cn-ebay">eBay</div><div class="cv">12</div></div><div class="ov-chcell"><div class="cn cn-temu">Temu</div><div class="cv">7</div></div></div>`;
document.getElementById('low').innerHTML = `<h4 class="ov-h-a">Running low · order 155<span class="sub">7-day lead time</span></h4>
  <table class="ov-t"><tbody>${[['BUDS-2-GRAPHITE', '6 on shelf · 1.4/day · out ~Sep 27', 30, 4], ['S24-FE-128GB-BLACK', '17 on shelf · 4 at WFS · 3.4/day', 80, 6], ['X620-128GB-SILVER', '9 on shelf · 1.5/day · out ~Sep 29', 35, 6], ['SGTT220GRAY', '2 on shelf · 0.4/day · out ~Sep 28', 10, 5]]
    .map(([s, m, o, d]) => `<tr><td><span class="ov-sku">${s}</span><span class="ov-meta">${m}</span></td><td class="rr"><span class="ov-pill a">${o}</span><span class="ov-meta">${d}d left</span></td></tr>`).join('')}</tbody></table>
  <div class="ov-more">Order = daily pace × (7-day lead + 21 days) − stock · <a>open Stock</a></div>`;

const head = (extra) => `<h4 class="ov-h-g">Send to WFS · ${ROWS.reduce((a, r) => a + r.send, 0)} units<span class="sub">${extra || `${ROWS.length} SKUs under 14 days`}</span></h4>`;
const flightHtml = () => `<div class="ov-sec">On the way to WFS<span class="n">70 units</span></div><table class="ov-t"><tbody>
  ${FLIGHT.map(f => `<tr><td><span class="ov-sku">${f.sku}</span>${f.more ? ` <span class="ov-dim">+${f.more} more</span>` : ''}<span class="ov-meta">${f.when}</span></td>
    <td class="rr"><span class="badge ov-badge ${f.st[0]}">${f.st[1]}</span>${f.done ? '<a class="ov-link">Undo</a>' : '<span class="ov-act"><button class="btn btn-ghost">Mark received</button></span>'}</td></tr>`).join('')}</tbody></table>`;

function s1() {
  return `${head()}
  <div class="ov-xgrid sv-grid">
    <div class="ov-xhead"><span>SKU</span><span class="n">/wk</span><span class="n">WFS</span><span class="n">Days</span><span class="n">Send</span><span></span></div>
    ${ROWS.map(r => `<div class="ov-feedrow">
      <span class="xsku">${r.sku}${r.ch ? `<small>${r.ch}</small>` : ''}</span>
      <span class="n">${r.wk}</span><span class="n">${r.atWfs}${r.onWay ? `<small class="ov-dim"> +${r.onWay}</small>` : ''}</span>
      <span class="n days ${tone(r.days)}">${r.days.toFixed(1)}</span><span class="n send">+${r.send}</span>
      <span class="acts"><button class="btn btn-secondary">Send</button><button class="sv-x" title="Ignore for 7 days">✕</button></span></div>`).join('')}
  </div>
  ${flightHtml()}
  <div class="ov-more">Send = WFS pace × 30 days − at WFS − on the way</div>`;
}

function s2() {
  return `${head()}
  ${ROWS.map(r => `<div class="sv-card ${tone(r.days)}">
    <div class="top"><div class="l"><span class="ov-sku">${r.sku}</span><span class="ov-meta">${r.ch || '&nbsp;'}</span></div>
      <div class="num"><b>+${r.send}</b><span>to send</span></div></div>
    <div class="stats"><div>Sells<b>${r.wk}/wk</b></div><div>At WFS<b>${r.atWfs}${r.onWay ? ` +${r.onWay}` : ''}</b></div><div>Lasts<b class="${tone(r.days) === 'g' ? '' : tone(r.days)}">${r.days.toFixed(1)} days</b></div></div>
    <div class="row"><button class="btn btn-primary">Send ${r.send} to WFS</button><a>Ignore</a></div>
  </div>`).join('')}
  ${flightHtml()}`;
}

function s3() {
  const sel = ROWS.filter(r => picked.has(r.sku));
  const units = sel.reduce((a, r) => a + r.send, 0);
  return `${head('tick, then send as one shipment')}
  <div class="sv-bar"><span class="t"><b>${sel.length}</b> SKU${sel.length === 1 ? '' : 's'} · <b>${units}</b> units</span>
    <button class="btn btn-primary" ${sel.length ? '' : 'disabled'}>Send selected</button></div>
  <table class="ov-t sv-check"><tbody>
  ${ROWS.map(r => `<tr class="${picked.has(r.sku) ? '' : 'off'}"><td><input type="checkbox" data-sku="${r.sku}" ${picked.has(r.sku) ? 'checked' : ''}></td>
    <td><span class="ov-sku">${r.sku}</span><span class="ov-meta">${[r.ch, `${r.wk}/wk`, `${r.atWfs} at WFS`, r.onWay ? `${r.onWay} on the way` : ''].filter(Boolean).join(' · ')}</span>
      <div class="ov-bar"><i class="${tone(r.days)}" data-w="${Math.min(100, r.days / 14 * 100)}"></i></div></td>
    <td class="rr"><input class="sv-qty" value="${r.send}"><button class="sv-x" title="Ignore for 7 days">✕</button><span class="ov-meta">${r.days.toFixed(1)}d left</span></td></tr>`).join('')}
  </tbody></table>
  ${flightHtml()}`;
}

const V = { s1, s2, s3 };
let cur = 's1';
function render() {
  const box = document.getElementById('wfs');
  box.innerHTML = V[cur]();
  box.querySelectorAll('.ov-bar i[data-w]').forEach(i => { i.style.width = `${i.dataset.w}%`; });
  document.querySelectorAll('#pick .ov-rbtn').forEach(b => b.classList.toggle('is-on', b.dataset.v === cur));
}
document.getElementById('pick').addEventListener('click', e => { const b = e.target.closest('.ov-rbtn'); if (b) { cur = b.dataset.v; render(); } });
document.getElementById('wfs').addEventListener('change', e => {
  const c = e.target.closest('input[type=checkbox]');
  if (!c) return;
  if (c.checked) picked.add(c.dataset.sku); else picked.delete(c.dataset.sku);
  render();
});
render();
</script>
</body>
</html>
