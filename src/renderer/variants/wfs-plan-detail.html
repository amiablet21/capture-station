<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>View plan — in-app detail, on the real page</title>
<style>
  @font-face { font-family: 'Geist'; src: url('file:///C:/Users/ndurs/Capture%20Station/src/renderer/fonts/Geist-Variable.woff2') format('woff2-variations'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('file:///C:/Users/ndurs/Capture%20Station/src/renderer/fonts/GeistMono-Variable.woff2') format('woff2-variations'); font-weight: 100 900; }
  :root {
    color-scheme: only light;
    --canvas: #F7F6F3; --surface: #FFFFFF; --surface-2: #F9F9F8;
    --border: #EAEAEA; --border-soft: rgba(0,0,0,0.06);
    --text: #2F3437; --muted: #787774; --faint: #A5A29C;
    --accent: #1E3A66; --accent-soft: #E4EAF4;
    --pos-bg: #EDF3EC; --pos-text: #346538;
    --badge-blue-text: #1F6C9F;
    --font: 'Geist', 'Segoe UI Variable', 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', 'Cascadia Mono', monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); font-size: 13px; line-height: 1.6; color: var(--text); background: var(--canvas); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 12px; }
  .brand { flex: 1; display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(30,58,102,.12); box-shadow: 0 1px 2px rgba(47,52,55,.08); background: #1E3A66; color: #fff; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .topbar-right { flex: 1; }
  .tabs { display: flex; gap: 2px; background: #EFEEEA; border-radius: 10px; padding: 3px; }
  .tab { font-family: var(--font); font-size: 12.5px; font-weight: 500; color: var(--muted); background: none; border: none; border-radius: 8px; padding: 5px 14px; cursor: pointer; }
  .tab.is-active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(47,52,55,.08); }
  .tab-caret { font-size: 9px; margin-left: 2px; color: var(--faint); }

  .wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 14px 24px 26px; }
  .rc-head { display: flex; align-items: flex-end; gap: 22px; border-bottom: 1px solid #EAEAEA; padding-bottom: 10px; margin-bottom: 16px; }
  .rc-h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; }
  .rc-subtabs { display: flex; gap: 22px; margin-left: 12px; align-items: flex-end; }
  .rc-subtab { font-family: inherit; font-size: 12.5px; font-weight: 500; color: #787774; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; line-height: 1.55; }
  .rc-subtab.is-active { font-weight: 600; color: #2F3437; padding-bottom: 10px; margin-bottom: -11px; border-bottom: 2px solid #1E3A66; }
  .rc-count { font-family: var(--mono); font-size: 11px; font-weight: 600; color: #9F2F2D; }
  .headright { margin-left: auto; align-self: center; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); }
  .refresh { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }

  /* breadcrumb back to the list */
  .crumb { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 12.5px; }
  .back { font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--accent); background: none; border: none; cursor: pointer; }
  .crumb .sep { color: var(--faint); }
  .crumb .here { color: var(--muted); font-family: var(--mono); font-size: 12px; }

  /* the plan, one card — same bones as the Sent to WFS cards */
  .plan { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px 10px; }
  .phead { display: flex; align-items: center; gap: 12px; }
  .phead h2 { font-size: 16px; font-weight: 600; }
  .phead h2 .mono { font-weight: 600; }
  .sp-status { font-size: 11.5px; font-weight: 500; padding: 3px 10px; border-radius: 5px; border: 1px solid #BFE2F7; color: var(--badge-blue-text); background: #F3FAFF; }
  .sc-link { margin-left: auto; font-size: 12px; color: var(--muted); background: none; border: none; font-family: inherit; cursor: pointer; }
  .sc-link:hover { color: var(--text); }
  .pmeta { margin: 2px 0 6px; font-size: 12.5px; color: var(--muted); }
  .pmeta .mono { font-size: 12px; color: var(--text); }
  .it.h { grid-template-columns: 220px minmax(0,1fr) 90px 90px; }
  .it { grid-template-columns: 220px minmax(0,1fr) 90px 90px; }
  .plan { padding-bottom: 16px; }

  /* timeline: one continuous rail behind centered dots — nothing drifts */
  .tl { display: flex; margin: 22px 0 6px; }
  .tl .st { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tl .st::before { content: ''; position: absolute; top: 6px; left: calc(-50% + 7px); width: calc(100% - 14px); height: 2px; background: #E4E2DC; }
  .tl .st:first-child::before { display: none; }
  .tl .st.done::before, .tl .st.cur::before { background: var(--accent); }
  .tl .dot { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; background: #fff; border: 1.5px solid #D6D4CF; }
  .tl .done .dot { background: var(--accent); border-color: var(--accent); }
  .tl .done .dot::after { content: ''; position: absolute; inset: 3.5px; border-radius: 50%; border: 1.5px solid #fff; border-width: 0; background: transparent; }
  .tl .cur .dot { border: 2px solid var(--accent); }
  .tl .cur .dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent); }
  .tl .t { font-size: 11.5px; font-weight: 500; line-height: 1.3; }
  .tl .todo .t { color: var(--faint); font-weight: 400; }
  .tl .d { font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.3; min-height: 14px; }

  /* shipment block: header row, address line, then the Excel-style items */
  .ship { border-top: 1px solid var(--border-soft); margin-top: 16px; padding: 14px 0 12px; }
  .shiphead { display: flex; align-items: center; gap: 24px; }
  .shiphead .sid { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .kv { font-size: 12.5px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 500; font-family: var(--mono); font-size: 12px; }
  .copy { font-size: 11.5px; color: var(--accent); cursor: pointer; border: none; background: none; font-family: var(--font); padding: 0 2px; }
  .track { margin-left: auto; font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--text); background: var(--surface); border: 1px solid #C9C7C2; border-radius: 999px; padding: 4px 16px; cursor: pointer; }
  .track:hover { background: var(--surface-2); }
  .addr { font-size: 12px; color: var(--faint); margin-top: 2px; }

  .it { display: grid; grid-template-columns: 220px minmax(0,1fr) 90px 90px 110px; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; align-items: center; }
  .it:last-child { border-bottom: none; }
  .it.h { margin-top: 12px; border-bottom: 1px solid var(--border); padding: 3px 0 6px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .it .u { text-align: right; font-variant-numeric: tabular-nums; }
  .it .ch { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .it .ds { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { justify-self: end; font-size: 10.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--pos-bg); color: var(--pos-text); }
  .pill.wait { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="brand-mark">dws</span></div>
  <div class="tabs">
    <button class="tab is-active">Overview</button><button class="tab">Orders</button><button class="tab">Stock</button><button class="tab">Walmart</button><button class="tab">Pricing</button><button class="tab">Returns <span class="tab-caret">▾</span></button><button class="tab">Recovery</button><button class="tab">Ship</button>
  </div>
  <div class="topbar-right"></div>
</div>

<div class="wrap">

</div>
</body>
</html>
