<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Image dialog B loading</title>
<link rel="stylesheet" href="_base.css" />
<style>
  .dlg { width: 480px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 48px rgba(47,52,55,0.12); margin: 40px auto; }
  .body { padding: 20px; }
  .t { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .sku { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .stage { position: relative; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface-2); height: 190px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.85) 50%, transparent 70%); animation: sweep 1.2s infinite; }
  @keyframes sweep { from { transform: translateX(-100%);} to { transform: translateX(100%);} }
  .load { display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1; }
  .spinner { width: 26px; height: 26px; border-radius: 999px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load b { font-size: 13px; font-weight: 600; }
  .load span { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .bar { width: 220px; height: 4px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
  .bar i { display: block; width: 62%; height: 100%; background: var(--accent); border-radius: 999px; }
  .urlrow { display: flex; gap: 8px; margin-top: 12px; }
  .urlrow input { flex: 1; font-size: 12.5px; font-family: var(--mono); padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-ctl); color: var(--faint); }
  .urlrow button { font-size: 13px; font-weight: 500; padding: 8px 16px; border: none; border-radius: var(--r-ctl); background: var(--accent-soft); color: var(--accent-soft-text); }
  .foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--surface-2); border-top: 1px solid var(--border); border-radius: 0 0 12px 12px; }
  .foot small { font-size: 11.5px; color: var(--faint); }
  .ghost { font-size: 13px; font-weight: 500; padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: transparent; color: var(--muted); }
</style></head>
<body>
  <div class="dlg">
    <div class="body">
      <div class="t">Product image</div>
      <div class="sku">X230-256GB-GRAY · Galaxy X230 256GB Gray</div>
      <div class="stage">
        <div class="shimmer"></div>
        <div class="load">
          <div class="spinner"></div>
          <b>Downloading image…</b>
          <div class="bar"><i></i></div>
          <span>walmartimages.com · 412 KB</span>
        </div>
      </div>
      <div class="urlrow">
        <input value="https://i5.walmartimages.com/asr/9b1c…f2e.jpeg" disabled />
        <button disabled>Adding…</button>
      </div>
    </div>
    <div class="foot"><small>The image saves to this SKU when the download finishes.</small><button class="ghost">Cancel</button></div>
  </div>
</body>
</html>
