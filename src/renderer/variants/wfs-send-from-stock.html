<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send to WFS from Stock</title>
<!--
  Owner 2026-11-07, on the Stock page's row hover tray (chart · history · DS ·
  rename · delete): "I want to have an option to send to WFS (given that there
  is a channel SKU there, it will allow us to pick which channel SKU to send it
  to, even if there is 1). If it hasn't been converted yet, it will give you a
  warning and ask you to convert it to WFS. After converting it, you will then
  be able to create a shipment to WFS." + "I want to be able to see ... a
  button to see the most recent shipments".
    A  a WFS key in the row tray, now Walmart's spark (owner 2026-11-07;
       ?tray=spark-grey | text | icon for the other takes) opens a popover:
       pick the Walmart listing (always, even with one) → not WFS? warn →
       convert in place → shipment (units / per box / arrive by) →
       Create shipment (opens the WFS shipment, variants/wfs-api-flow.html)
    The spark opens on that SKU's WFS shipments (owner 2026-11-07: "the same
    button, you will have a popup of all inbound shipments"): conversions in
    progress, then every shipment with received / sent and Walmart's status;
    Send to WFS starts the flow above. The toolbar dropdown and the draft
    were dropped ("i dont really want this"); the full log stays in
    Stock › Actions › WFS Shipments. A full-window version was tried and
    dropped (owner 2026-11-07: "i liked the pop up better"); this popover is
    the design
  WFS view bonus: the At WFS cell carries "+N inbound" for open shipments.
  Mockup only, sample data (SKUs from the owner's screenshot; counts,
  shipments and statuses invented). Nothing here talks to Walmart.
-->
<style>
  @font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2-variations'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2-variations'); font-weight: 100 900; }
  :root { color-scheme: only light;
    --canvas:#F7F6F3; --surface:#FFF; --surface-2:#F9F9F8; --border:#EAEAEA; --border-soft:rgba(0,0,0,0.06);
    --text:#2F3437; --muted:#787774; --faint:#A5A29C;
    --accent:#1E3A66; --accent-hover:#152B4E; --accent-soft:#E4EAF4; --accent-soft-text:#1E3A66;
    --pos-bg:#EDF3EC; --pos-text:#346538; --neg-bg:#FDEBEC; --neg-text:#9F2F2D;
    --blue-bg:#E1F3FE; --blue:#1F6C9F; --yellow-bg:#FBF3DB; --yellow:#956400;
    --wm:#2E86D9; --sheet:#1f9d5b;
    --r-card:8px; --r-ctl:6px; --r-modal:12px;
    --font:'Geist','Segoe UI Variable','Segoe UI',sans-serif; --mono:'Geist Mono','Cascadia Mono',monospace;
    --ease:cubic-bezier(0.16,1,0.3,1); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); font-size:13px; line-height:1.5; background:var(--canvas); color:var(--text); padding:24px 28px 60px; }
  button { font-family:inherit; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ---------- page chrome (not part of the app) ---------- */
  .pg-h { font-size:16px; font-weight:600; letter-spacing:-0.02em; }
  .pg-sub { font-size:12px; color:var(--muted); margin:2px 0 14px; max-width:1080px; }
  .steps { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; align-items:center; }
  .steps .grp { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:0 4px 0 10px; }
  .steps .grp:first-child { margin-left:0; }
  .step { display:flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:999px; padding:4px 12px 4px 5px; font-size:12px; font-weight:500; cursor:pointer; }
  .step i { font-style:normal; width:19px; height:19px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); border:1px solid var(--border); font-size:10.5px; font-weight:600; font-family:var(--mono); }
  .step.on { color:var(--text); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .step.on i { background:var(--accent); color:#fff; border-color:var(--accent); }
  .why { max-width:1080px; margin:14px 0 0; font-size:12px; color:var(--muted); background:var(--surface); border:1px dashed #D9D6CF; border-radius:8px; padding:10px 14px; }
  .why b { color:var(--text); font-weight:600; }

  /* ---------- the Stock page ---------- */
  .stage { position:relative; width:1080px; max-width:100%; margin-top:12px; }
  .band { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface); border:1px solid var(--border); border-bottom:none; border-radius:var(--r-card) var(--r-card) 0 0; }
  .search { display:flex; align-items:center; gap:8px; flex:0 1 220px; white-space:nowrap; overflow:hidden; border:1px solid var(--border); border-radius:999px; padding:5px 12px; color:var(--faint); font-size:12.5px; }
  .search svg { width:13px; height:13px; flex:none; }
  .chip-tray { display:flex; gap:2px; background:#EFEEEA; border-radius:10px; padding:3px; }
  .view-chip { font-size:12px; font-weight:500; padding:4px 11px; border-radius:8px; border:none; background:none; color:var(--muted); white-space:nowrap; cursor:pointer; display:inline-flex; align-items:center; }
  .view-chip.dot::before { content:''; width:7px; height:7px; border-radius:50%; margin-right:6px; background:currentColor; opacity:.35; }
  .view-chip.c-green::before { background:#346538; } .view-chip.c-blue::before { background:#1F6C9F; } .view-chip.c-yellow::before { background:#956400; } .view-chip.c-red::before { background:#9F2F2D; }
  .view-chip.on { background:var(--surface); color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(47,52,55,0.08); }
  .chip-unl { background:var(--yellow-bg); color:var(--yellow); font-weight:600; border-radius:999px; padding:4px 12px; font-size:12px; white-space:nowrap; }
  .band-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
  .btn { font-size:13px; font-weight:500; padding:7px 14px; border-radius:var(--r-ctl); border:1px solid transparent; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .btn-ghost { background:var(--surface); color:var(--muted); border-color:var(--border); }
  .btn-ghost:hover { color:var(--text); background:rgba(0,0,0,0.03); }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover:not(:disabled) { background:var(--accent-hover); }
  .btn-primary:disabled { opacity:.45; cursor:default; }
  .btn-secondary { background:var(--accent-soft); color:var(--accent-soft-text); }
  .btn-sm { font-size:12px; padding:5px 11px; }
  .btn svg { width:14px; height:14px; }
  .btn-band { padding:6px 12px; font-size:12.5px; }
  .btn-wfs.open { color:var(--text); border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .cnt { font-family:var(--mono); font-size:10.5px; font-weight:700; background:var(--blue-bg); color:var(--blue); border-radius:999px; padding:0 6px; }
  .ico-btn { width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--border); border-radius:var(--r-ctl); background:var(--surface); color:var(--muted); }
  .ico-btn svg { width:14px; height:14px; }

  .sheet { background:var(--surface); border:1px solid var(--border); border-radius:0 0 var(--r-card) var(--r-card); overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { background:var(--surface-2); text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:7px 10px; border-bottom:1px solid var(--border); border-right:1px solid var(--border-soft); white-space:nowrap; }
  th:last-child { border-right:none; }
  th.num, td.num { text-align:right; }
  th.g { width:36px; text-align:center; border-right:1px solid var(--border); }
  td { padding:6px 10px; height:44px; border-bottom:1px solid var(--border-soft); border-right:1px solid var(--border-soft); white-space:nowrap; vertical-align:middle; }
  td:last-child { border-right:none; }
  td.g { text-align:center; color:var(--faint); font-size:11.5px; }
  td.img { width:58px; padding:4px 8px; }
  .thumb { width:30px; height:34px; border-radius:4px; margin:auto; background:linear-gradient(160deg,#2b3036 0 18%,#5fd3a0 60%,#2b3036 100%); border:2px solid #2b3036; }
  .thumb.s { background:linear-gradient(160deg,#d9dde2 0 18%,#5fd3a0 60%,#d9dde2 100%); border-color:#cfd3d8; }
  .thumb.w { width:42px; height:28px; background:linear-gradient(120deg,#1d2b4e,#4f6fb8 60%,#1d2b4e); border-color:#1b1d22; }
  .thumb.p { width:42px; height:28px; background:linear-gradient(120deg,#f47fa1,#a07cf0 60%,#f2b37c); border-color:#2b3036; }
  tbody tr:hover td:not(.g), tbody tr.open td:not(.g) { background:var(--surface-2); }
  td.sku { font-family:var(--mono); font-size:13px; position:relative; }
  .delta { font-size:11px; margin-left:8px; color:var(--pos-text); }
  .delta.z { color:var(--faint); }
  td.lvl { width:150px; font-family:var(--mono); font-size:13px; }
  td.home { width:150px; font-family:var(--mono); font-size:13px; }
  .inb { font-family:var(--font); font-size:10.5px; font-weight:600; color:var(--blue); background:var(--blue-bg); border-radius:999px; padding:1px 7px; margin-right:10px; cursor:pointer; }

  /* the row hover tray (mirrors .stock-tray), now with a WFS key */
  .tray { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:inline-flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:1px 4px; visibility:hidden; box-shadow:0 2px 8px rgba(47,52,55,0.08); }
  tbody tr:hover .tray, tbody tr.open .tray { visibility:visible; }
  .bi { width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border:none; background:none; border-radius:6px; color:var(--muted); cursor:pointer; position:relative; }
  .bi svg { width:15px; height:15px; }
  .bi:hover { background:var(--accent-soft); color:var(--accent-soft-text); }
  .bi.danger:hover { background:var(--neg-bg); color:var(--neg-text); }
  .bi.today::after { content:''; position:absolute; top:3px; right:3px; width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .tray-ds { font-family:var(--mono); font-size:10px; font-weight:700; color:var(--muted); border:none; background:none; border-radius:6px; padding:3px 7px; cursor:pointer; }
  .tray-ds:hover { background:var(--accent-soft); color:var(--accent-soft-text); }
  /* NEW: the WFS key, as quiet as its neighbours (owner 2026-11-07: the
     blue pill "looks weird"). Text option = DS's twin; icon option = a .bi.
     Tinted only on hover or while its popup is open */
  .tray-wfs { font-family:var(--mono); font-size:10px; font-weight:700; color:var(--muted); border:none; background:none; border-radius:6px; padding:3px 7px; cursor:pointer; }
  .tray-wfs:hover, .tray-wfs.on, .bi.tray-wfs-i.on { background:var(--accent-soft); color:var(--accent-soft-text); }
  /* Walmart spark option (owner 2026-11-07: "can you make the Walmart logo in
     there"). spark = always Walmart yellow; spark-grey = grey at rest, yellow
     on hover / while the popup is open. The real build should use Walmart's
     own logo file, not this hand-drawn stand-in */
  .bi.wm { color:#FFC220; }
  .bi.wm svg { width:16px; height:16px; }
  .bi.wm.grey { color:#B9B6AF; }
  .bi.wm:hover, .bi.wm.on { background:#FFF4D6; color:#FFC220; }

  /* ---------- popover (anchored to the WFS key) · v2 ----------
     owner 2026-11-07 "make the pop up better looking": product header with
     count pills, a thin step bar, check-circle cards whose warning lives
     inside the picked card, one primary action that changes with the state,
     a units stepper, no gray footer band */
  .pop { position:absolute; z-index:5; width:428px; background:var(--surface); border:1px solid rgba(47,52,55,0.10); border-radius:14px; box-shadow:0 28px 64px -16px rgba(30,42,66,0.28), 0 4px 12px rgba(30,42,66,0.06); }
  .pop::before { content:''; position:absolute; top:-7px; right:var(--caret,28px); width:12px; height:12px; background:var(--surface); border-left:1px solid rgba(47,52,55,0.10); border-top:1px solid rgba(47,52,55,0.10); border-radius:3px 0 0 0; transform:rotate(45deg); }
  .ph { display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; padding:16px 16px 12px 18px; }
  .ph-img { width:44px; height:44px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); display:grid; place-items:center; overflow:hidden; }
  .ph-img .thumb { transform:scale(.8); }
  .pk { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--muted); }
  .pk .spark { width:13px; height:13px; color:#FFC220; }
  .ph-sku { font-family:var(--mono); font-size:15px; font-weight:600; letter-spacing:-0.01em; line-height:1.35; }
  .ph-t { font-size:11.5px; color:var(--muted); }
  .px { align-self:start; border:none; background:none; color:var(--faint); width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:12px; }
  .px:hover { background:var(--surface-2); color:var(--text); }
  .stats { display:flex; gap:6px; padding:0 18px 14px; }
  .stat { display:flex; align-items:baseline; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px 10px; font-size:11px; color:var(--muted); }
  .stat b { font-family:var(--mono); font-size:12.5px; color:var(--text); font-weight:600; }
  .stat.in b { color:var(--blue); }
  .prog { display:grid; gap:4px; padding:0 18px; }
  .prog i { height:3px; border-radius:2px; background:#ECEAE5; }
  .prog i.d { background:var(--accent); }
  .prog-l { display:grid; gap:4px; padding:5px 18px 0; font-size:10.5px; color:var(--faint); }
  .prog-l b { color:var(--text); font-weight:600; }
  .pb { padding:16px 18px 16px; }
  .sec-h { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .sec-h b { font-size:12.5px; font-weight:600; }
  .sec-h span { font-size:11px; color:var(--faint); }

  .opt2 { border:1px solid var(--border); border-radius:10px; cursor:pointer; overflow:hidden; transition:border-color 120ms var(--ease), background 120ms var(--ease); }
  .opt2 + .opt2 { margin-top:8px; }
  .opt2:hover { background:var(--surface-2); }
  .opt2.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:#F7F9FD; }
  .opt2-r { display:grid; grid-template-columns:18px 1fr auto; gap:11px; align-items:center; padding:11px 12px; }
  .ck { width:18px; height:18px; border-radius:50%; border:1.5px solid #CFCCC5; display:grid; place-items:center; background:var(--surface); }
  .ck svg { width:10px; height:10px; color:#fff; opacity:0; }
  .opt2.on .ck { background:var(--accent); border-color:var(--accent); }
  .opt2.on .ck svg { opacity:1; }
  .o-sku { font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--blue); }
  .o-meta { font-size:11.5px; color:var(--muted); }
  .o-meta b { font-family:var(--mono); font-weight:600; color:var(--text); }
  .st { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; white-space:nowrap; }
  .st::before { content:''; width:7px; height:7px; border-radius:50%; }
  .st.ok { color:var(--pos-text); } .st.ok::before { background:#3FA66B; }
  .st.no { color:var(--yellow); } .st.no::before { background:#E0A526; }
  .opt2-w { display:flex; gap:8px; align-items:flex-start; padding:9px 12px 10px 41px; background:#FFF8E6; border-top:1px solid #F3E3B5; font-size:11.5px; color:#7a5300; line-height:1.45; }
  .opt2-w svg { width:14px; height:14px; flex:none; margin:1px 0 0 -22px; color:#C08A12; }
  .opt2-w a { color:var(--accent); font-weight:600; cursor:pointer; white-space:nowrap; }
  .opt2-w a:hover { text-decoration:underline; }
  .hint2 { font-size:11px; color:var(--faint); margin-top:10px; }

  .pf { display:flex; align-items:center; gap:8px; padding:12px 16px 14px 18px; border-top:1px solid var(--border-soft); }
  .pf .grow { margin-right:auto; }
  .tbtn { border:none; background:none; color:var(--muted); font-size:12.5px; font-weight:500; padding:7px 10px; border-radius:8px; cursor:pointer; }
  .tbtn:hover { background:var(--surface-2); color:var(--text); }
  .tbtn:first-child { margin-left:-10px; }
  .pbtn { display:inline-flex; align-items:center; gap:6px; border:none; background:var(--accent); color:#fff; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer; box-shadow:0 1px 2px rgba(30,58,102,0.25); }
  .pbtn:hover:not(:disabled) { background:var(--accent-hover); }
  .pbtn:disabled { opacity:.45; cursor:default; box-shadow:none; }
  .pbtn svg { width:13px; height:13px; }
  .sbtn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12.5px; font-weight:500; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .sbtn:hover { background:var(--surface-2); }

  /* convert */
  .cv-h { font-size:13px; font-weight:600; margin-bottom:3px; }
  .cv-h .mono { color:var(--blue); }
  .cv-s { font-size:11.5px; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .tag { font-size:10px; font-weight:600; background:var(--blue-bg); color:var(--blue); border-radius:999px; padding:1px 7px; }
  .fl { display:grid; grid-template-columns:78px 1fr; gap:10px 12px; align-items:center; }
  .fl .l2 { font-size:11.5px; color:var(--muted); }
  .ig { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
  .ig input { border:none; outline:none; width:44px; padding:6px 8px; font-family:var(--mono); font-size:12px; text-align:right; background:none; color:var(--text); }
  .ig .x { color:var(--faint); font-size:11px; }
  .ig .u { font-size:11px; color:var(--faint); padding:0 9px 0 0; }
  .seg2 { display:inline-flex; background:#F1F0EC; border-radius:8px; padding:2px; gap:2px; }
  .seg2 span { font-size:11.5px; padding:4px 10px; border-radius:6px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .seg2 span.on { background:var(--surface); color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.08); }
  .row2 { display:flex; align-items:center; gap:8px; }
  .track { display:flex; align-items:center; margin-top:16px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); }
  .tk { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--faint); white-space:nowrap; }
  .tk i { width:16px; height:16px; border-radius:50%; border:1.5px solid #D6D3CC; display:grid; place-items:center; flex:none; }
  .tk i svg { width:9px; height:9px; color:#fff; }
  .tk.d { color:var(--text); } .tk.d i { background:#3FA66B; border-color:#3FA66B; }
  .tk.now { color:var(--text); font-weight:600; } .tk.now i { border-color:var(--wm); box-shadow:0 0 0 3px var(--blue-bg); animation:pulse 1.2s infinite; }
  .tk-line { flex:1; height:1.5px; background:#E2DFD9; margin:0 8px; min-width:12px; }
  .tk-line.d { background:#3FA66B; }
  .lw { display:flex; gap:10px; align-items:flex-start; margin-top:10px; padding:10px 12px; border:1px dashed #D9D6CF; border-radius:10px; font-size:11.5px; color:var(--muted); cursor:pointer; }
  .lw input { margin-top:2px; accent-color:var(--accent); width:14px; height:14px; flex:none; }
  .lw b { color:var(--text); font-weight:600; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* shipment */
  .into { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted); margin-bottom:12px; }
  .into .pill { display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px 10px 2px 9px; }
  .into .pill .mono { color:var(--blue); font-size:11.5px; font-weight:600; }
  .qty { display:flex; align-items:center; gap:16px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; }
  .stp { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .stp button { width:32px; height:40px; border:none; background:var(--surface-2); color:var(--muted); font-size:16px; cursor:pointer; }
  .stp button:hover { color:var(--text); background:#F1F0EC; }
  .stp input { width:62px; height:40px; border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); text-align:center; font-family:var(--mono); font-size:20px; font-weight:600; color:var(--text); outline:none; }
  .qty-l { font-size:10.5px; color:var(--faint); text-align:center; margin-top:4px; }
  .qty-r { display:flex; flex-direction:column; gap:6px; font-size:11.5px; color:var(--muted); }
  .qty-r b { font-family:var(--mono); color:var(--text); font-weight:600; }
  .qty-r .ig input { width:34px; padding:4px 6px; }

  pending: `<b>The conversion's detail</b>: the Sent / Reviewing / Approved track, when it was last checked, and two actions: <b>Check now</b>, or <b>Use WFS listing</b> to send the stock to the listing that's already on WFS. Hover the <b>2 days</b> pill for when it was sent and why it can take long. A rejection turns it red with Walmart's reason and <b>Fix &amp; resend</b>.`,

const $ = (id) => document.getElementById(id);
function set(k) {
  Object.assign(S, { menu: false, pop: null, pend: k === 'pending' || k === 'pendhome', checked: false });
  if (k === 'home' || k === 'pendhome') { S.row = 'X133-64GB-GRAY'; S.pop = 'home'; }
  else if (k === 'empty') { S.row = 'X400-128GB-GRAY'; S.pop = 'home'; }
  else if (k === 'pending') { S.row = 'X133-64GB-GRAY'; S.pick = 'x110gray'; S.converted = false; S.converting = false; S.pop = 'pending'; }
  else if (k === 'one') { S.row = 'X610-128GB-BLACK'; S.pick = 'X610-128GB-BLACK-WFS'; S.pop = 'pick'; }
  else {
    S.row = 'X133-64GB-GRAY';
    if (k === 'pick') { S.pick = 'X133-64GB-GRAY-WFS'; S.pop = 'pick'; }
    if (k === 'warn') { S.pick = 'x110gray'; S.converted = false; S.converting = false; S.pop = 'pick'; }
    if (k === 'convert') { S.pick = 'x110gray'; S.pop = 'convert'; }
    if (k === 'ship') { S.pop = 'ship'; }
  }
  render();
}
function curStep() {
  if (S.pop === 'home') return !HIST[S.row] ? 'empty' : S.pend && S.row === 'X133-64GB-GRAY' ? 'pendhome' : 'home';
  if (S.pop === 'pick' && S.row === 'X610-128GB-BLACK') return 'one';
  if (S.pop === 'pick') return isWfs(S.pick) ? 'pick' : 'warn';
  return S.pop;
}
function isWfs(ch) {
  const l = (LISTINGS[S.row] || []).find(x => x.ch === ch);
  return l ? (l.wfs || (ch === 'x110gray' && S.converted)) : false;
}

function render() {
  const cs = curStep();
  $('steps').innerHTML = STEPS.map(s => s.g ? `<span class="grp">${s.g}</span>`
    : `<button class="step${cs === s.k ? ' on' : ''}" onclick="set('${s.k}')"><i>${s.n}</i>${s.t}</button>`).join('');
  const pop = S.pop ? `<div class="pop fade" id="pop">${({ home: popHome, pick: popPick, convert: popConvert, ship: popShip, pending: popPending })[S.pop]()}</div>` : '';
  $('stage').innerHTML = bandHtml() + tableHtml() + pop + (S.menu ? menuHtml() : '');
  $('why').innerHTML = WHY[cs] || WHY.pick;
  $('stage').style.marginBottom = '0px';
  const stage = $('stage').getBoundingClientRect();
  if (S.pop) {
    const key = document.querySelector(`[data-wfs="${S.row}"]`).getBoundingClientRect();
    const p = $('pop'); const w = p.offsetWidth;
    let left = key.left + key.width / 2 - stage.left - w + 34;
    left = Math.max(8, Math.min(left, stage.width - w - 8));
    p.style.left = left + 'px';
    p.style.top = (key.bottom - stage.top + 10) + 'px';
    p.style.setProperty('--caret', (w - (key.left + key.width / 2 - stage.left - left) - 6) + 'px');
  }
  if (S.menu) {
    const b = $('wfsBtn').getBoundingClientRect(); const m = $('menu');
    m.style.top = (b.bottom - stage.top + 6) + 'px';
    m.style.left = Math.max(8, b.right - stage.left - m.offsetWidth) + 'px';
  }
  // the floating card may hang below the table: push the notes down under it
  const fl = $('pop') || $('menu');
  if (fl) $('stage').style.marginBottom = Math.max(0, fl.offsetTop + fl.offsetHeight + 16 - $('stage').offsetHeight) + 'px';
}
// ?s=pick|warn|convert|ship|one|menu (+ &done=1 converted, &draft=1) opens a state (screenshots)
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('done')) S.converted = true;
  if (q.get('draft')) S.draftAdded = true;
  set(q.get('s') || 'home');
  if (q.get('pick')) { S.pick = q.get('pick'); render(); }
  if (q.get('hover')) { S.pop = null; S.hover = q.get('hover'); render(); }
})();
</script>
