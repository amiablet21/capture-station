<style>
/* Layout: the DWS Stock window (top bar, Walmart card) with every Walmart sub-tab live; sample data only. */
:root {
  --canvas: #F7F6F3; --surface: #FFFFFF; --surface-2: #F9F9F8; --row-on: #F3F6FB;

  --pos-bg: #EDF3EC; --pos-text: #346538; --neg-bg: #FDEBEC; --neg-text: #9F2F2D;
  --warn-bg: #FBF3DB; --warn-text: #956400; --info-bg: #E1F3FE; --info-text: #1F6C9F;
  --star: #E8A317; --star-off: #DCDAD4;
  --shadow: rgba(47,52,55,.10); --scrim: rgba(30,35,40,.28);
  --font: 'Geist', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', 'Cascadia Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #191A1C; --surface: #222326; --surface-2: #26272A; --row-on: #22293A;
  --border: #34363A; --border-soft: rgba(255,255,255,.06);
  --text: #E6E5E2; --muted: #A09E99; --faint: #6F6D69;
  --accent: #8FB0E6; --accent-hover: #A9C3EE; --accent-soft: #2A3550; --accent-soft-text: #C9D8F2; --on-accent: #111827;
  --pos-bg: #213025; --pos-text: #8BC79A; --neg-bg: #3A2224; --neg-text: #F09A97;
  --warn-bg: #3A3020; --warn-text: #E3BE6A; --info-bg: #1E3240; --info-text: #8CC6EE;
  --star: #E8B04A; --star-off: #45464A;
  --shadow: rgba(0,0,0,.4); --scrim: rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #191A1C; --surface: #222326; --surface-2: #26272A; --row-on: #22293A;
  --border: #34363A; --border-soft: rgba(255,255,255,.06);
  --text: #E6E5E2; --muted: #A09E99; --faint: #6F6D69;
  --accent: #8FB0E6; --accent-hover: #A9C3EE; --accent-soft: #2A3550; --accent-soft-text: #C9D8F2; --on-accent: #111827;
  --pos-bg: #213025; --pos-text: #8BC79A; --neg-bg: #3A2224; --neg-text: #F09A97;
  --warn-bg: #3A3020; --warn-text: #E3BE6A; --info-bg: #1E3240; --info-text: #8CC6EE;
  --star: #E8B04A; --star-off: #45464A;
  --shadow: rgba(0,0,0,.4); --scrim: rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--canvas); color: var(--text); font-family: var(--font); font-size: 13.5px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 90px; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0; }

.mono { font-family: var(--mono); }

.demo-note { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.demo-note b { color: var(--text); font-weight: 600; }
.demo-note button { background: none; border: none; color: var(--accent); font-weight: 600; padding: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 10px; letter-spacing: -.02em; }
.apptabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%; }
.apptabs span { padding: 5px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.apptabs span.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px var(--shadow); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
.head { display: flex; align-items: center; gap: 14px; padding: 16px 20px 12px; flex-wrap: wrap; }
.head h1 { font-size: 16px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
.subtabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.subtabs button { border: none; background: none; padding: 4px 14px; border-radius: 8px; font-size: 12.5px; color: var(--muted); font-weight: 500; position: relative; }
.subtabs button:hover { color: var(--text); }
.subtabs button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px var(--shadow); }
.subtabs .dot { position: absolute; top: 3px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.prog { display: flex; gap: 26px; padding: 0 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.prog button { background: none; border: none; border-bottom: 2px solid transparent; padding: 12px 0 11px; margin-bottom: -1px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.prog button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

.bar { display: flex; align-items: center; gap: 8px; padding: 14px 20px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.chip b { font-weight: 700; margin-left: 5px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-soft-text); border-color: transparent; }
.bar .spacer { flex: 1; }
.btn { border: 1px solid transparent; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn:disabled { opacity: .45; cursor: default; }
.prog-pref { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.sw { width: 36px; height: 20px; border-radius: 999px; background: var(--border); position: relative; border: none; padding: 0; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px var(--shadow); transition: left .15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { left: 18px; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 820px; }
th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 9px 12px; background: var(--surface-2); border-block: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
th:first-child, td:first-child { padding-left: 20px; }
tr.sel td { background: var(--row-on); }
tr.fade td { animation: fade .5s ease; }
@keyframes fade { from { background: var(--pos-bg); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { tr.fade td { animation: none; } .sw::after { transition: none; } }
.ck { width: 44px; }
.ck input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; padding: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ph { width: 38px; height: 38px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); flex: none; display: grid; place-items: center; color: var(--faint); }
.ph svg { width: 18px; height: 18px; }
.item .tx { min-width: 0; }
.item b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
.item small { display: block; font-size: 12px; color: var(--muted); }
.sku { font-family: var(--mono); font-size: 12px; }
.was { color: var(--faint); text-decoration: line-through; margin-right: 6px; }
.strong { font-weight: 700; }
.fee-old { color: var(--faint); text-decoration: line-through; margin-right: 6px; }
.fee-new { color: var(--pos-text); font-weight: 700; }
.exp { color: var(--muted); white-space: nowrap; }
.exp.soon { color: var(--neg-text); font-weight: 600; }
.act { text-align: right; padding-right: 20px; white-space: nowrap; }
.row-btn { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 5px 14px; font-size: 12.5px; font-weight: 700; }
.row-btn.quiet { color: var(--muted); border-color: var(--border); font-weight: 600; }
.row-btn.on { background: var(--accent); color: var(--on-accent); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.ok { background: var(--pos-bg); color: var(--pos-text); }
.pill.wait { background: var(--warn-bg); color: var(--warn-text); }
.pill.bad { background: var(--neg-bg); color: var(--neg-text); }
.pill.off { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }

/* List: search first, then set up the offer */
.search { display: flex; gap: 8px; padding: 4px 20px 6px; flex-wrap: wrap; }
.search input { flex: 1 1 360px; font-size: 14px; padding: 10px 14px; }
.modes { display: flex; gap: 6px; padding: 4px 20px 8px; flex-wrap: wrap; }
.browser { margin: 14px 20px 20px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.browser-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.browser-bar .dots { display: flex; gap: 5px; }
.browser-bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.browser-bar .url { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.browser-note { padding: 8px 12px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--border-soft); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 14px; }
.tile { position: relative; border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .img { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--faint); }
.tile .img svg { width: 34px; height: 34px; }
.tile .p { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.tile .t { font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .r { font-size: 11px; color: var(--muted); }
.tile .lt { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .12s; box-shadow: 0 4px 12px var(--shadow); }
.tile:hover .lt, .tile:focus-within .lt, .tile.on .lt { opacity: 1; }
@media (hover: none) { .tile .lt { opacity: 1; } }
.tile.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.hint { padding: 0 20px 14px; font-size: 12px; color: var(--muted); }
.hint button { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 12px; }
.lgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); border-top: 1px solid var(--border); }
@media (max-width: 860px) { .lgrid { grid-template-columns: minmax(0, 1fr); } }
.lres { min-width: 0; }
.lres-h { padding: 10px 20px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border-soft); }
.res { display: flex; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border-soft); }
.res.on { background: var(--row-on); box-shadow: inset 3px 0 0 var(--accent); }
.res .tx { flex: 1; min-width: 0; }
.res .t { font-weight: 600; }
.res .m { font-size: 12px; color: var(--muted); }
.res .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.res .p { font-weight: 700; font-variant-numeric: tabular-nums; }
.res a { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
.stars { position: relative; display: inline-block; font-size: 12px; line-height: 1; letter-spacing: 1px; color: var(--star-off); vertical-align: -1px; margin-right: 4px; }
.stars::before { content: '★★★★★'; }
.stars i { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; color: var(--star); font-style: normal; }
.stars i::before { content: '★★★★★'; }
.offer { border-left: 1px solid var(--border); padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--surface-2); }
@media (max-width: 860px) { .offer { border-left: none; border-top: 1px solid var(--border); } }
.offer h3 { margin: 0; font-size: 14px; font-weight: 600; }
.offer .sub { font-size: 12px; color: var(--muted); margin-top: -8px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sugg { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.sugg button { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: none; border: none; border-top: 1px solid var(--border-soft); padding: 7px 10px; color: var(--text); }
.sugg button:first-child { border-top: none; }
.sugg button:hover { background: var(--row-on); }
.sugg small { color: var(--muted); white-space: nowrap; }
.map-ok { font-size: 12px; color: var(--pos-text); font-weight: 600; }
.map-new { font-size: 12px; color: var(--warn-text); }
.upc { font-size: 12px; color: var(--muted); }
.upc b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.offer-empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
.offer-empty b { display: block; color: var(--text); margin-bottom: 4px; }

.tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -6px 20px var(--shadow); z-index: 15;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tray-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tray-list { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.tray-list span { font-family: var(--mono); font-size: 11.5px; background: var(--accent-soft); color: var(--accent-soft-text); border-radius: 999px; padding: 3px 4px 3px 10px; display: inline-flex; align-items: center; gap: 4px; }
.tray-list span button { background: none; border: none; color: inherit; padding: 0 5px; font-size: 12px; }

/* Uploads */
.up-lines td { background: var(--surface-2); font-size: 12.5px; padding-top: 8px; padding-bottom: 8px; }
.up-lines .why { color: var(--neg-text); }
.linkish { background: none; border: none; padding: 0; color: var(--accent); font-weight: 600; }

/* Pricing */
.p-in { width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
.p-in.chg, select.chg { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.yes { color: var(--pos-text); font-weight: 700; }
.no { color: var(--neg-text); font-weight: 700; }
.no small { color: var(--muted); font-weight: 500; font-size: 12.5px; margin-left: 6px; }
.dash { color: var(--faint); }
.inc-cell { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.joined { font-size: 12px; font-weight: 700; color: var(--pos-text); }
.savebar { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.savebar .spacer { flex: 1; }

.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dlg { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 20px 50px var(--shadow); max-height: 90vh; display: flex; flex-direction: column; }
.dlg h2 { font-size: 16px; font-weight: 600; letter-spacing: -.02em; margin: 0; padding: 18px 20px 4px; }
.dlg p { margin: 0; padding: 0 20px 12px; color: var(--muted); font-size: 13px; }
.dlg ul { list-style: none; margin: 0; padding: 0 20px; overflow-y: auto; }
.dlg li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border-soft); font-size: 13px; }
.dlg li .sku { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlg li .chg { white-space: nowrap; font-variant-numeric: tabular-nums; }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; border-top: 1px solid var(--border); margin-top: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--canvas); padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px var(--shadow); z-index: 30; max-width: calc(100% - 32px); }
</style>

<div class="wrap">

      <div class="prog" role="tablist">

    L.results = words.length ? CATALOG.map(c => [c, words.filter(w => c.title.toLowerCase().includes(w)).length])
      .filter(x => x[1] === words.length).map(x => x[0]) : [];
  }
  renderList();
}

      <button type="button" class="chip" data-view="active" aria-pressed="${!ready}">Active<b>${count('active')}</b></button><span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="bulk" ${n ? '' : 'disabled'}>${ready ? 'Enroll' : 'Unenroll'} ${n ? n + ' selected' : 'selected'}</button>`;
  } else {
    const inV = view.wf === 'in';
    bar = `<button type="button" class="chip" data-view="in" aria-pressed="${inV}">Enrolled<b>${count('in')}</b></button>
      <button type="button" class="chip" data-view="out" aria-pressed="${!inV}">Opted out<b>${count('out')}</b></button><span class="spacer"></span>
      <span class="prog-pref">Walmart-funded discounts <button type="button" class="sw" id="wfSw" role="switch" aria-checked="${S.wfOn}" aria-label="Walmart-funded discounts on or off"></button></span>
      <button type="button" class="btn btn-primary" id="bulk" ${n && S.wfOn ? '' : 'disabled'}>${inV ? 'Opt out' : 'Opt back in'} ${n ? n + ' selected' : 'selected'}</button>`;
  }
  $('bar').innerHTML = bar;
  const all = list.length && list.every(r => picked.has(r.id));
  if (prog === 'rrf') {
    $('thead').innerHTML = `<tr><th class="ck"><input type="checkbox" id="all" aria-label="Select all" ${all ? 'checked' : ''}></th><th>Item</th><th class="num">Price</th><th class="num">Referral fee</th><th class="num">Inventory</th><th>Expires</th><th class="act"></th></tr>`;
    $('tbody').innerHTML = list.map(r => {
      const ready = r.state === 'ready';
      const price = ready && r.target < r.price ? `<span class="was">${money(r.price)}</span><span class="strong">${money(r.target)}</span>` : `<span class="strong">${money(ready ? r.price : r.target)}</span>`;
      const act = ready ? `<button type="button" class="row-btn" data-one="${r.id}">Enroll</button>`
        : r.state === 'pending' ? `<span class="pill wait">Sending to Walmart…</span>`
        : `<span class="pill ok">Active</span> <button type="button" class="row-btn quiet" data-one="${r.id}">Unenroll</button>`;
      return `<tr class="${picked.has(r.id) ? 'sel' : ''} ${r.flash ? 'fade' : ''}"><td class="ck"><input type="checkbox" data-pick="${r.id}" aria-label="Select ${esc(r.sku)}" ${picked.has(r.id) ? 'checked' : ''} ${r.state === 'pending' ? 'disabled' : ''}></td>
        <td>${itemCell(r)}</td><td class="num">${price}</td>
        <td class="num"><span class="fee-old">${r.base}%</span><span class="fee-new">${r.red}%</span></td>
        <td class="num">${r.inv}</td><td class="exp ${r.soon ? 'soon' : ''}">${r.exp}</td><td class="act">${act}</td></tr>`;
    }).join('');
  } else {
    $('thead').innerHTML = `<tr><th class="ck"><input type="checkbox" id="all" aria-label="Select all" ${all ? 'checked' : ''} ${S.wfOn ? '' : 'disabled'}></th><th>Item</th><th class="num">Your price</th><th class="num">Shopper pays</th><th class="num">Walmart pays</th><th>Ends</th><th class="act"></th></tr>`;
    $('tbody').innerHTML = list.map(r => {
      const inP = r.state === 'in';
      const pays = r.price * r.off / 100;
      const act = !S.wfOn ? `<span class="pill off">Program off</span>`
        : inP ? `<button type="button" class="row-btn quiet" data-one="${r.id}">Opt out</button>` : `<button type="button" class="row-btn" data-one="${r.id}">Opt back in</button>`;
      return `<tr class="${picked.has(r.id) ? 'sel' : ''} ${r.flash ? 'fade' : ''}"><td class="ck"><input type="checkbox" data-pick="${r.id}" aria-label="Select ${esc(r.sku)}" ${picked.has(r.id) ? 'checked' : ''} ${S.wfOn ? '' : 'disabled'}></td>
        <td>${itemCell(r)}</td><td class="num strong">${money(r.price)}</td>
        <td class="num">${inP && S.wfOn ? `<span class="was">${money(r.price)}</span>${money(r.price - pays)}` : money(r.price)}</td>
        <td class="num">${inP && S.wfOn ? `<span class="fee-new">${r.off}% · ${money(pays)}</span>` : '<span class="exp">—</span>'}</td>
        <td class="exp">${r.exp}</td><td class="act">${act}</td></tr>`;
    }).join('');
  }
  S[prog].forEach(r => { r.flash = false; });
  const empty = !list.length;
  $('empty').hidden = !empty;
  $('thead').parentElement.hidden = empty;
  if (empty) {
    const msg = prog === 'rrf'
      ? (view.rrf === 'ready' ? ['Nothing left to enroll', 'Walmart has no more reduced-fee offers for your items right now.'] : ['No active incentives', 'Items you enroll show up here.'])
      : (view.wf === 'in' ? ['No items enrolled', 'Items you opt back in show up here.'] : ['No items opted out', 'Walmart-funded discounts apply to all eligible items.']);
    $('empty').innerHTML = `<b>${msg[0]}</b>${msg[1]}`;
  }
}

/* ---------- confirm popup (incentives, sending a batch) ---------- */
let confirmAction = null;
function openConfirm(title, text, items, yes, action) {
  confirmAction = action;
  $('cTitle').textContent = title; $('cText').textContent = text; $('cYes').textContent = yes; $('cList').innerHTML = items.join('');
  $('confirm').hidden = false; $('cYes').focus();
}
function closeConfirm() { confirmAction = null; pending = null; $('confirm').hidden = true; }

function ask(ids) {
  const items = ids.map(id => S[prog].find(r => r.id === id));
  const n = items.length, s = n > 1 ? 's' : '';
  pending = ids;
  if (prog === 'rrf' && items[0].state === 'ready') {
    const moves = items.some(r => r.target < r.price);
    openConfirm(`Enroll ${n} item${s}?`, moves ? 'Walmart sets each item to its target price. The lower fee applies while the price stays at or below it.' : 'The lower fee applies while the price stays at or below the target.',
      items.map(r => `<li><span class="sku">${esc(r.sku)}</span><span class="chg">${r.target < r.price ? `<span class="was">${money(r.price)}</span><b>${money(r.target)}</b>` : money(r.price)} · fee ${r.base}% → ${r.red}%</span></li>`), 'Enroll', apply);
  } else if (prog === 'rrf') {
    openConfirm(`Unenroll ${n} item${s}?`, 'The standard referral fee applies again. Prices stay where they are.',
      items.map(r => `<li><span class="sku">${esc(r.sku)}</span><span class="chg">fee ${r.red}% → ${r.base}%</span></li>`), 'Unenroll', apply);
  } else if (items[0].state === 'in') {
    openConfirm(`Opt out ${n} item${s}?`, 'Shoppers stop getting the Walmart-paid discount on these items.',
      items.map(r => `<li><span class="sku">${esc(r.sku)}</span><span class="chg">${r.off}% off ends</span></li>`), 'Opt out', apply);
  } else {
    openConfirm(`Opt ${n} item${s} back in?`, 'Walmart pays the discount; your payout does not change.',
      items.map(r => `<li><span class="sku">${esc(r.sku)}</span><span class="chg">${r.off}% off, Walmart pays</span></li>`), 'Opt back in', apply);
  }
}
function apply() {
  const ids = pending; closeConfirm();
  const items = ids.map(id => S[prog].find(r => r.id === id));
  const n = items.length, s = n > 1 ? 's' : '';
  if (prog === 'rrf' && items[0].state === 'ready') {
    items.forEach(r => { r.state = 'pending'; });
    view.rrf = 'active'; picked.clear(); render();
    toast(`Sent ${n} item${s} to Walmart`);
    setTimeout(() => {
      items.forEach(r => { if (r.state === 'pending') { r.state = 'active'; r.flash = true; } });
      items.forEach(r => { const p = S.pricing.rows.find(x => x.sku === r.sku); if (p) { p.price = p.orig = r.target; } });
      if (S.sub === 'incentives' && prog === 'rrf') render(); else if (S.sub === 'pricing') renderPricing();
      toast(`${n} item${s} enrolled · prices updated`);
    }, 1800);
  } else if (prog === 'rrf') {
    items.forEach(r => { r.state = 'ready'; r.price = r.target; }); picked.clear(); render();
    toast(`${n} item${s} unenrolled`);
  } else {
    const out = items[0].state === 'in';
    items.forEach(r => { r.state = out ? 'out' : 'in'; r.flash = true; }); picked.clear(); render();
    toast(out ? `${n} item${s} opted out` : `${n} item${s} opted back in`);
  }
}
function sendBatch() {
  const b = S.list.batch;
  openConfirm(`Send ${plural(b.length, 'item')} to Walmart?`, 'Each goes up under your SKU. Walmart usually takes a few minutes to put them live.',
    b.map(x => `<li><span><span class="sku">${esc(x.sku)}</span> · ${esc(x.cond)}</span><span class="chg">${money(x.price)} · qty ${x.qty}</span></li>`), 'Send', () => {
      closeConfirm();
      const up = { id: 'u' + Date.now(), sent: 'Just now', state: 'processing', open: true, flash: true,
        lines: b.map(x => ({ sku: x.sku, title: x.title, ok: true })) };
      S.uploads.unshift(up); S.list.batch = []; S.upNew = true;
      showSub('uploads');
      toast(`Sent ${plural(up.lines.length, 'item')} to Walmart`);
      setTimeout(() => { up.state = 'done'; up.flash = true; if (S.sub === 'uploads') renderUploads(); else { S.upNew = true; $('upDot').hidden = false; } toast('Walmart finished your upload'); }, 3500);
    });
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, input[type=checkbox]'); if (!t) return;
  if (t.dataset.sub) showSub(t.dataset.sub);
  else if (t.dataset.try) { runSearch(t.dataset.try); }
  else if (t.dataset.mode) { S.list.mode = t.dataset.mode; renderList(); }
  else if (t.dataset.pickItem) { pick(t.dataset.pickItem); renderList(); }
  else if (t.dataset.sku) { const L = S.list; L.sku = t.dataset.sku; const x = LINN.find(l => l.sku === L.sku); L.cond = condFor(L.sku); if (x) L.qty = String(x.avail); renderOffer(); }
  else if (t.id === 'addBatch') {
    const L = S.list, it = CATALOG.find(c => c.itemId === L.pick), linn = LINN.find(x => x.sku.toLowerCase() === L.sku.trim().toLowerCase());
    L.batch.push({ itemId: it.itemId, title: it.title, sku: linn ? linn.sku : L.sku.trim(), cond: L.cond, price: parseFloat(L.price), qty: parseInt(L.qty, 10), linked: !!linn && L.cond === 'New' });
    toast(`${linn ? linn.sku : L.sku.trim()} added to the batch`); L.pick = null; renderList(); renderTray();
  }
  else if (t.dataset.unbatch) { S.list.batch.splice(+t.dataset.unbatch, 1); renderTray(); renderList(); }
  else if (t.id === 'send') sendBatch();
  else if (t.dataset.up) { const u = S.uploads.find(x => x.id === t.dataset.up); u.open = !u.open; renderUploads(); }
  else if (t.dataset.fix) { showSub('list'); runSearch(''); toast(`Search for ${t.dataset.fix} again to fix and resend`); }
  else if (t.dataset.pf) { S.pricing.filter = t.dataset.pf; renderPricing(); }
  else if (t.dataset.join) { showSub('incentives'); prog = 'rrf'; view.rrf = 'ready'; render(); ask([t.dataset.join]); }
  else if (t.id === 'pUndo') { S.pricing.rows.forEach(r => { r.price = r.orig; r.rp = r.rpOrig; }); renderPricing(); }
  else if (t.id === 'pSaveBtn') { const n = S.pricing.rows.filter(r => r.price !== r.orig || r.rp !== r.rpOrig).length; S.pricing.rows.forEach(r => { r.orig = r.price; r.rpOrig = r.rp; }); renderPricing(); toast(`${plural(n, 'change')} sent to Walmart`); }
  else if (t.dataset.prog) { prog = t.dataset.prog; picked.clear(); render(); }
  else if (t.dataset.view) { view[prog] = t.dataset.view; picked.clear(); render(); }
  else if (t.dataset.one) ask([t.dataset.one]);
  else if (t.dataset.pick) { picked.has(t.dataset.pick) ? picked.delete(t.dataset.pick) : picked.add(t.dataset.pick); render(); }
  else if (t.id === 'all') { const list = rows().filter(r => r.state !== 'pending'); const on = !list.every(r => picked.has(r.id)); picked = new Set(on ? list.map(r => r.id) : []); render(); }
  else if (t.id === 'bulk' && picked.size) ask([...picked]);
  else if (t.id === 'wfSw') { S.wfOn = !S.wfOn; picked.clear(); render(); toast(S.wfOn ? 'Walmart-funded discounts turned on' : 'Walmart-funded discounts turned off for all items'); }
  else if (t.id === 'cYes') { if (confirmAction) confirmAction(); }
  else if (t.id === 'cNo') closeConfirm();
  else if (t.id === 'reset') { S = SEED(); prog = 'rrf'; view = { rrf: 'ready', wf: 'in' }; picked.clear(); runSearch(S.list.q); showSub('list'); toast('Back to the start'); }
});
document.addEventListener('input', (e) => {
  const t = e.target, L = S.list;
  if (t.id === 'oSku') { L.sku = t.value; const x = LINN.find(l => l.sku.toLowerCase() === t.value.trim().toLowerCase()); if (x) { L.cond = condFor(x.sku); L.qty = String(x.avail); } const pos = t.selectionStart; renderOffer(); const n = $('oSku'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.id === 'oPrice') { L.price = t.value; $('addBatch').disabled = !(L.sku.trim() && parseFloat(L.price) > 0 && L.qty !== ''); }
  else if (t.id === 'oQty') { L.qty = t.value; $('addBatch').disabled = !(L.sku.trim() && parseFloat(L.price) > 0 && L.qty !== ''); }
  else if (t.dataset.price) { const r = S.pricing.rows[+t.dataset.price]; const v = parseFloat(t.value); if (v > 0) { r.price = Math.round(v * 100) / 100; t.classList.toggle('chg', r.price !== r.orig); renderSave(); } }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'oCond') S.list.cond = t.value;
  else if (t.dataset.rp) { const r = S.pricing.rows[+t.dataset.rp]; r.rp = t.value; t.classList.toggle('chg', r.rp !== r.rpOrig); renderSave(); }
});
$('sForm').addEventListener('submit', (e) => { e.preventDefault(); runSearch($('sQ').value); });
$('confirm').addEventListener('click', (e) => { if (e.target === $('confirm')) closeConfirm(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('confirm').hidden) closeConfirm(); });
runSearch(S.list.q);
showSub('list');
</script>
