<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Overview — Send to WFS · Sold Items · Running Low (pick one)</title>
<!--
  Owner brief 2026-09-22: the Overview page is ONLY three columns.
    1. Send to WFS   - which items are moving + which channel SKUs to prioritise for WFS
    2. Sold Items    - Excel-style grid of every SKU sold today (SKU, units)
    3. Running Low   - SKUs selling that are low on stock + an order prediction from sales history
  Round 2 (owner: "don't look native"): built INSIDE the app shell on the real
  styles.css, reusing only existing Overview components - .ov-mcard, .ov-xgrid
  (the "full grid" the owner picked for Latest orders), .ov-drawer-style tables,
  .ov-pill, .ov-chcells, .ov-ranges, .view-chip. The only new CSS is column
  layout + grid column templates (the "ov3-" block below).
  Flip designs with the Design A/B/C toggle in the top-left.
  Forecast rules (same in every design):
    WFS send qty = Walmart 7d avg/day x 30d target cover - units at WFS (capped by warehouse available)
    Reorder qty  = 30d avg/day x (14d lead time + 30d cover) - on hand, rounded up to 5
-->
<link rel="stylesheet" href="../styles.css" />
<style>
  /* ---- mockup-only: the design picker in the brand slot ---- */
  .ov3-pick { display: flex; align-items: center; gap: 8px; }
  .ov3-pick .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .ov3-pick .ov-ranges { margin-left: 0; }

  /* ---- new layout: three columns under the header ---- */
  .ov3-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: start; }
  .ov3-cols.mid-wide { grid-template-columns: 1fr 1.1fr 1fr; }
  .ov-panel.ov3-flush { padding: 0; overflow: hidden; }
  .ov3-cardhead { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
  .ov3-cardhead .k { display: flex; align-items: center; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .ov3-cardhead .k .sub { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 10.5px; color: var(--muted); }
  .ov3-cardhead .big { font-family: var(--mono); font-size: 27px; font-weight: 700; margin: 3px 0 1px; }
  .ov3-cardhead .s { font-size: 10.5px; color: var(--muted); }
  .ov3-body { padding: 4px 6px 6px; }
  .ov3-foot { font-size: 10.5px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--border); background: var(--surface-2); }
  .ov3-foot a, .ov-more a { color: #065F46; font-weight: 600; cursor: pointer; }

  /* drawer-style tables living inside a column card */
  .ov3-t { border-collapse: collapse; width: 100%; font-size: 12px; }
  .ov3-t th { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); text-align: left; padding: 6px 8px 5px; border-bottom: 1px solid var(--border); }
  .ov3-t th.rr, .ov3-t td.rr { text-align: right; }
  .ov3-t td { padding: 7px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .ov3-t tr:last-child td { border-bottom: none; }
  .ov3-t tbody tr:hover td { background: var(--surface-2); }
  .ov3-t .chsku { display: block; font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .ov3-t .runs { display: block; font-size: 10px; color: var(--muted); }

  /* the Latest-orders Excel grid, reused for SKU | Units (no bottom fade:
     every sold SKU must stay readable) */
  .ov-xgrid.ov3-full { -webkit-mask-image: none; mask-image: none; }
  .ov3-g2 .ov-xhead, .ov3-g2 .ov-feedrow { grid-template-columns: 34px 1fr 64px 60px; }
  .ov3-g2.no-ch .ov-xhead, .ov3-g2.no-ch .ov-feedrow { grid-template-columns: 34px 1fr 60px; }
  .ov3-g2 .xrn { color: var(--faint); text-align: center; text-overflow: clip; background: #F4F3F0; font-family: var(--mono); font-size: 9.5px; }
  .ov3-g2 .ov-xhead span:last-child { text-align: right; }
  .ov3-g2 .ov-feedrow .xu { font-family: var(--mono); font-size: 11.5px; font-weight: 700; text-align: right; }
  .ov3-g2 .ov-feedrow .xsku { color: var(--text); font-size: 10.5px; font-family: var(--mono); }
  .ov3-g2 .ov-feedrow.tot { background: var(--surface-2); border-top: 1px solid #E0DED8; }
  .ov3-g2 .ov-feedrow.tot span { font-weight: 700; }
  .ov3-g5 .ov-xhead, .ov3-g5 .ov-feedrow { grid-template-columns: 1fr 44px 48px 52px 56px; }
  .ov3-g5 .ov-feedrow span.n, .ov3-g5 .ov-xhead span.n { text-align: right; font-family: var(--mono); }
  .ov3-g5 .ov-feedrow span.n { font-size: 11px; }
  .ov3-g5 .ov-feedrow .xsku { color: var(--badge-blue-text); font-weight: 600; font-size: 10.5px; font-family: var(--mono); }
  .ov3-g5 .ov-feedrow .strong { font-weight: 700; color: var(--text); }

  /* sold column as a "today" card: channel cells pinned to its bottom */
  .ov3-sold { padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; }

  /* urgency bar under a WFS / low-stock row */
  .ov3-bar { height: 3px; background: #EFEEEA; border-radius: 999px; overflow: hidden; margin-top: 5px; }
  .ov3-bar i { display: block; height: 100%; border-radius: 999px; }
  .ov3-chips { display: flex; gap: 4px; padding: 0 0 8px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="ov3-pick"><span class="lbl">Design</span>
        <span class="ov-ranges" id="pick">
          <button class="ov-rbtn is-on" data-v="a">A</button>
          <button class="ov-rbtn" data-v="b">B</button>
          <button class="ov-rbtn" data-v="c">C</button>
        </span>
      </span>
    </div>
    <nav class="tabs">
      <button class="tab is-active">Overview</button>
      <button class="tab">Capture</button>
      <button class="tab">Stock</button>
      <button class="tab">Returns <span class="tab-caret">▾</span></button>
      <button class="tab">Listings</button>
    </nav>
    <div class="topbar-right"></div>
  </header>

  <section class="ov-page">
    <div class="ov-sheet-row">
      <div class="ov-wrap">
        <div class="ov-head"><h1>Overview</h1><span class="ov-date">Tuesday, September 22</span>
          <button class="btn btn-ghost ov-refresh" title="Refresh the numbers now">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232,56v48a12,12,0,0,1-12,12H172a12,12,0,0,1,0-24h19.1l-10.11-9.25a76,76,0,1,0,2.3,109.84,12,12,0,0,1,17.42,16.5,100,100,0,1,1-3.18-141.11L208,77V56a12,12,0,0,1,24,0Z"/></svg>
            Refresh</button>
          <button class="btn btn-ghost ov-phone">Phone</button>
        </div>
        <div id="root"></div>
      </div>
      <div class="sheet-grip"></div>
    </div>
  </section>

  <footer class="footbar">
    <div class="footbar-left"></div>
    <div class="footbar-right">
      <span class="sync-status">Last sync 2:14 PM</span>
      <button class="btn btn-ghost">History</button>
    </div>
  </footer>

<script>
// ---------- shared mock data ----------
// Send to WFS: Walmart listings moving. [inventory SKU, Walmart channel SKU, walmart 7d units, at WFS, warehouse avail]
const WFS = [
  ['X400-128GB-GRAY',    'WM-X400-128-GRY',  42,  6, 58],
  ['BUDS-3-WHITE',       'WM-BUDS3-WHT',     35,  9, 40],
  ['S24-FE-128GB-BLACK', 'WM-S24FE-128-BLK', 21,  4, 17],
  ['X520-256GB-SILVER',  'WM-X520-256-SLV',  18, 12, 33],
  ['SM-X133-64GB-GREY',  'WM-X133-64-GRY',   14, 11, 26],
  ['X730-512GB-GRAY',    'WM-X730-512-GRY',  10, 14, 22],
  ['TABA9+64GB',         'WM-TABA9-64',       8, 15, 30],
];
const SOLD = [
  ['X400-128GB-GRAY', 9, 'walmart'], ['BUDS-3-WHITE', 7, 'walmart'], ['X520-128GB-SILVER', 5, 'ebay'],
  ['S24-FE-128GB-BLACK', 4, 'walmart'], ['BUDS-2-GRAPHITE', 4, 'temu'], ['X230-256GB-GRAY', 3, 'ebay'],
  ['SM-X133-64GB-GREY', 3, 'walmart'], ['X620-128GB-SILVER', 2, 'ebay'], ['X730-512GB-GRAY', 2, 'walmart'],
  ['TABA9+64GB', 2, 'temu'], ['X400-256GB-SILVER', 1, 'ebay'], ['SGTT220GRAY', 1, 'temu'],
  ['X520-256GB-SILVER', 1, 'walmart'], ['X400-128GB-GRAY-CASE', 1, 'ebay'],
];
// Running low: [sku, on hand, 30d units sold, lead days, recent-vs-older pace]
const LOW = [
  ['S24-FE-128GB-BLACK', 17, 96, 14, 1.3],
  ['BUDS-2-GRAPHITE',     6, 38, 10, 1.2],
  ['X620-128GB-SILVER',   9, 41, 14, 1.0],
  ['X230-256GB-GRAY',    12, 45, 14, 1.2],
  ['X520-128GB-SILVER',  21, 62, 14, 1.1],
  ['SGTT220GRAY',         4, 11, 21, 1.0],
];
const CH = { walmart: 'Walmart', ebay: 'eBay', temu: 'Temu' };
const TARGET = 30;

const wfs = WFS.map(([sku, ch, u7, atWfs, wh]) => {
  const perDay = u7 / 7, cover = atWfs / perDay;
  return { sku, ch, u7, perDay, atWfs, wh, cover, send: Math.max(0, Math.min(wh, Math.ceil(perDay * TARGET - atWfs))) };
}).sort((a, b) => a.cover - b.cover);
const low = LOW.map(([sku, onHand, u30, lead, accel]) => {
  const perDay = u30 / 30, daysLeft = onHand / perDay;
  const out = new Date(2026, 8, 22 + Math.floor(daysLeft)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return { sku, onHand, u30, perDay, lead, daysLeft, accel, out, order: Math.max(0, Math.ceil((perDay * (lead + TARGET) - onHand) / 5) * 5) };
}).sort((a, b) => a.daysLeft - b.daysLeft);
const sold = [...SOLD].sort((a, b) => b[1] - a[1]);
const soldUnits = sold.reduce((s, r) => s + r[1], 0);
const byCh = sold.reduce((m, [, u, c]) => (m[c] = (m[c] || 0) + u, m), {});
const wfsUnits = wfs.reduce((s, r) => s + r.send, 0);
const orderUnits = low.reduce((s, r) => s + r.order, 0);

const pill = d => d < 5 ? 'r' : d < 10 ? 'a' : 'g';
const tone = d => d < 5 ? 'var(--neg-text)' : d < 10 ? 'var(--badge-yellow-text)' : 'var(--accent)';
const f1 = n => n.toFixed(1);

// Excel grid of sold SKUs (the owner's "full grid" from Latest orders)
function soldGrid(withChannel) {
  const ch = (c) => withChannel ? `<span class="xch xch-${c}">${c ? CH[c] : ''}</span>` : '';
  return `<div class="ov-xgrid ov3-full ov3-g2${withChannel ? '' : ' no-ch'}">
    <div class="ov-xhead"><span class="xrn">#</span><span>SKU</span>${withChannel ? '<span>Channel</span>' : ''}<span>Units</span></div>
    ${sold.map(([s, u, c], i) => `<div class="ov-feedrow"><span class="xrn">${i + 1}</span><span class="xsku" title="${s}">${s}</span>${ch(c)}<span class="xu">${u}</span></div>`).join('')}
    <div class="ov-feedrow tot"><span class="xrn"></span><span>Total · ${sold.length} SKUs</span>${ch('')}<span class="xu">${soldUnits}</span></div>
  </div>`;
}

// ---------- A · Three cards: money-card header + drawer table in each column ----------
function A() {
  return `<div class="ov3-cols">
    <div class="ov-panel ov3-flush">
      <div class="ov3-cardhead"><div class="k">Send to WFS<span class="sub">most urgent first</span></div>
        <div class="big ov-big-g">${wfsUnits} units</div><div class="s">${wfs.length} Walmart SKUs outrunning their WFS stock</div></div>
      <div class="ov3-body"><table class="ov3-t"><thead><tr><th>SKU</th><th>Sold/wk</th><th>Covers</th><th class="rr">Send</th></tr></thead><tbody>
      ${wfs.map(r => `<tr><td><span class="ov-sku">${r.sku}</span><span class="chsku">${r.ch}</span></td><td class="mono">${r.u7}</td><td class="ov-dim">${f1(r.cover)} days</td><td class="rr"><span class="ov-pill ${pill(r.cover)}">+ ${r.send}</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="ov3-foot">7-day Walmart pace × 30 days − at WFS · <a>WFS Shipments</a></div>
    </div>
    <div class="ov-panel ov3-flush">
      <div class="ov3-cardhead"><div class="k">Sold today<span class="sub">${sold.length} SKUs</span></div>
        <div class="big">${soldUnits} units</div><div class="s">every SKU that sold today</div></div>
      <div style="padding:10px 12px 12px">${soldGrid(true)}</div>
    </div>
    <div class="ov-panel ov3-flush">
      <div class="ov3-cardhead"><div class="k">Running low<span class="sub">from 30-day sales</span></div>
        <div class="big ov-big-a">${orderUnits} to order</div><div class="s">${low.length} SKUs run out before a reorder lands</div></div>
      <div class="ov3-body"><table class="ov3-t"><thead><tr><th>SKU</th><th>On shelf</th><th>Runs out</th><th class="rr">Order</th></tr></thead><tbody>
      ${low.map(r => `<tr><td><span class="ov-sku">${r.sku}</span><span class="runs">${f1(r.perDay)}/day${r.accel > 1.1 ? ' · <span style="color:var(--neg-text)">selling faster</span>' : ''}</span></td><td class="mono">${r.onHand}</td><td class="ov-dim">in ${Math.floor(r.daysLeft)} days</td><td class="rr"><span class="ov-pill a">${r.order}</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="ov3-foot">30-day avg × (lead + 30 days) − on shelf · <a>open Stock</a></div>
    </div>
  </div>`;
}

// ---------- B · All grids: three money cards on top, Excel grids below ----------
function B() {
  return `<div class="ov-cards" style="margin-bottom:10px">
      <div class="ov-mcard"><div class="k">Send to WFS</div><div class="big ov-big-g">${wfsUnits} units</div><div class="s">${wfs.filter(r => r.cover < 10).length} Walmart SKUs under 10 days of cover</div></div>
      <div class="ov-mcard"><div class="k">Sold today</div><div class="big">${soldUnits} units</div><div class="s">${sold.length} SKUs · Walmart ${byCh.walmart} · eBay ${byCh.ebay} · Temu ${byCh.temu}</div></div>
      <div class="ov-mcard"><div class="k">Running low</div><div class="big ov-big-a">${low.length} SKUs</div><div class="s">order ${orderUnits} units to cover lead + 30 days</div></div>
    </div>
    <div class="ov3-cols">
      <div class="ov-panel"><h4 style="color:#065F46">Send to WFS<span class="sub">sorted by days of cover</span></h4>
        <div class="ov-xgrid ov3-full ov3-g5">
          <div class="ov-xhead"><span>Walmart SKU</span><span class="n">/wk</span><span class="n">WFS</span><span class="n">Cover</span><span class="n">Send</span></div>
          ${wfs.map(r => `<div class="ov-feedrow"><span class="xsku" title="${r.ch}">${r.sku}</span><span class="n">${r.u7}</span><span class="n">${r.atWfs}</span><span class="n" style="color:${tone(r.cover)};font-weight:700">${f1(r.cover)}d</span><span class="n strong">+${r.send}</span></div>`).join('')}
        </div>
        <div class="ov-more">7-day Walmart pace × 30 days − at WFS · <a>WFS Shipments</a></div>
      </div>
      <div class="ov-panel"><h4>Sold items<span class="sub">today</span></h4>${soldGrid(true)}</div>
      <div class="ov-panel"><h4 style="color:var(--badge-yellow-text)">Running low<span class="sub">30-day forecast</span></h4>
        <div class="ov-xgrid ov3-full ov3-g5">
          <div class="ov-xhead"><span>SKU</span><span class="n">Shelf</span><span class="n">/day</span><span class="n">Left</span><span class="n">Order</span></div>
          ${low.map(r => `<div class="ov-feedrow"><span class="xsku">${r.sku}</span><span class="n">${r.onHand}</span><span class="n">${f1(r.perDay)}</span><span class="n" style="color:${tone(r.daysLeft)};font-weight:700">${Math.floor(r.daysLeft)}d</span><span class="n strong">${r.order}</span></div>`).join('')}
        </div>
        <div class="ov-more">30-day avg × (lead + 30 days) − on shelf · <a>open Stock</a></div>
      </div>
    </div>`;
}

// ---------- C · Today card in the middle, ranked lists either side ----------
function C() {
  return `<div class="ov3-cols mid-wide">
    <div class="ov-panel">
      <h4 style="color:#065F46">Send to WFS · ${wfsUnits} units<span class="sub">${wfs.length} Walmart SKUs</span></h4>
      <div class="ov3-chips"><button class="view-chip is-active">All</button><button class="view-chip">Under 5 days</button><button class="view-chip">This week</button></div>
      <table class="ov3-t"><tbody>
      ${wfs.map((r, i) => `<tr><td style="width:18px" class="ov-dim mono">${i + 1}</td><td><span class="ov-sku">${r.sku}</span><span class="chsku">${r.ch} · ${r.u7}/wk · ${r.atWfs} at WFS</span>
        <div class="ov3-bar"><i style="width:${Math.min(100, r.cover / 14 * 100)}%;background:${tone(r.cover)}"></i></div></td>
        <td class="rr"><span class="ov-pill ${pill(r.cover)}">+ ${r.send}</span><span class="runs" style="margin-top:3px">${f1(r.cover)}d left</span></td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="ov-panel ov-today ov3-sold">
      <div><div class="k">Units sold today</div>
        <div class="big mono">${soldUnits}</div>
        <div class="delta">▲ <b class="mono">+7</b> vs yesterday</div></div>
      ${soldGrid(false)}
      <div class="ov-chcells">${['walmart', 'ebay', 'temu'].map(k => `<div class="ov-chcell"><div class="cn cn-${k}">${CH[k]}</div><div class="cv">${byCh[k]}</div></div>`).join('')}</div>
    </div>
    <div class="ov-panel">
      <h4 style="color:var(--badge-yellow-text)">Running low · order ${orderUnits}<span class="sub">30-day history</span></h4>
      <table class="ov3-t"><tbody>
      ${low.map(r => `<tr><td><span class="ov-sku">${r.sku}</span><span class="chsku">${r.onHand} on shelf · ${f1(r.perDay)}/day · out ~${r.out}</span>
        <div class="ov3-bar"><i style="width:${Math.min(100, r.daysLeft / r.lead * 100)}%;background:${tone(r.daysLeft)}"></i></div></td>
        <td class="rr"><span class="ov-pill a">${r.order}</span><span class="runs" style="margin-top:3px">${Math.floor(r.daysLeft)}d left</span></td></tr>`).join('')}
      </tbody></table>
      <div class="ov-more">Bar = days left vs. lead time · <a>open Stock</a></div>
    </div>
  </div>`;
}

const V = { a: A, b: B, c: C };
function show(v) {
  document.getElementById('root').innerHTML = V[v]();
  document.querySelectorAll('#pick .ov-rbtn').forEach(b => b.classList.toggle('is-on', b.dataset.v === v));
}
document.querySelectorAll('#pick .ov-rbtn').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
show('a');
</script>
</body>
</html>
