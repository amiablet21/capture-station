# One-off for the move to capture-station-releases (2026-10-18): copies a
# release from there into THIS repo, so stations still on v1.32.85 or older
# (which look for updates here) find the first version that looks there.
# Run it once for v1.32.86 after its builds finish; later releases are
# only needed in capture-station-releases. Safe to re-run.

name: Copy a release here

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to copy from capture-station-releases (e.g. v1.32.86)'
        required: true

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the installers and the updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FROM: amiablet21/capture-station-releases
        run: |
          mkdir dl
          # the releases repo is public, so this repo's token can read it
          gh release download "$TAG" --repo "$FROM" --dir dl
          ls -la dl
          ls dl/*.exe >/dev/null 2>&1 && ls dl/latest.yml >/dev/null 2>&1 && ls dl/*.dmg >/dev/null 2>&1 \
            || { echo "::error::$FROM $TAG is missing the .exe, latest.yml or .dmg - wait for both builds to finish"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest --notes "Copied from $FROM"
          for i in 1 2 3 4; do
            gh release upload "$TAG" dl/* --repo "$GITHUB_REPOSITORY" --clobber && break
            echo "attempt $i failed"; sleep 20
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          for F in dl/*; do
            N="$(basename "$F")"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fxq "$N" \
              || { echo "::error::$N did not land on $TAG"; exit 1; }
          done
          echo "Copied $TAG: $(ls dl | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
