# Starts the Windows build. The build itself runs in the public
# amiablet21/capture-station-releases repo (its "Build" workflow), which
# checks out this commit, builds, and publishes the GitHub Release there —
# the repo the in-app updater reads. It moved there so this repo can be
# private: a public repo's Actions minutes are free, and ~125 releases a
# month would overrun a private repo's 2,000 (owner 2026-10-18).
#
# Runs when:
#   - a version tag is pushed (v1.32.86 ...) -> builds AND publishes
#   - the "Run workflow" button is pressed on the Actions tab -> builds;
#     with a release_tag it also tags this commit and publishes; with
#     copy_release_here it only copies that release into this repo (the
#     one-off for the move, see the copy job)
# The build's progress and installers are on the releases repo's Actions
# tab, not here.
#
# Needs one repository secret: RELEASE_BOT_TOKEN, a fine-grained token
# for capture-station + capture-station-releases with Contents: read and
# Actions: read and write (the releases repo keeps the same token to check
# this repo out).

name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish a GitHub Release under this tag (e.g. v1.32.86); empty = artifact only'
        required: false
        default: ''
      copy_release_here:
        description: 'One-off for the move: instead of building, copy release_tag from capture-station-releases into this repo (v1.32.86, for stations on v1.32.85)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # tag the built commit here, as the releases used to

jobs:
  start:
    if: ${{ !inputs.copy_release_here }}
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: amiablet21/capture-station-releases
    steps:
      - uses: actions/checkout@v4

      # a release whose installers are stamped with an older version is
      # worse than no release (v1.27.11 shipped 1.27.4-named files on
      # 2026-09-09) — refuse to start a mismatched release at all
      - name: Release tag must match package.json version
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          [ -n "$TAG" ] || exit 0
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER - bump package.json first"
            exit 1
          fi

      # keeps every version findable in this repo's history; a tag made
      # with the workflow token does not re-trigger this workflow
      - name: Tag the built commit
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null \
            || { echo "::error::could not create tag $TAG"; exit 1; }

      - name: Start the build in capture-station-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_BOT_TOKEN secret is missing - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          gh workflow run build.yml --repo "$RELEASE_REPO" \
            -f source_sha="$GITHUB_SHA" -f release_tag="$TAG" -f platform=windows
          {
            echo "Started the Windows build of \`${GITHUB_SHA::7}\`${TAG:+ for $TAG}."
            echo ""
            echo "Progress and installers: https://github.com/$RELEASE_REPO/actions/workflows/build.yml"
          } >> "$GITHUB_STEP_SUMMARY"

  # one-off for the move to capture-station-releases (2026-10-18): stations
  # on v1.32.85 or older look for updates HERE, so the first version that
  # looks there (v1.32.86) has to be here too. Safe to re-run; drop this job
  # once every station runs v1.32.86 or newer.
  copy:
    if: ${{ inputs.copy_release_here }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy the installers and the updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FROM: amiablet21/capture-station-releases
        run: |
          mkdir dl
          # the releases repo is public, so this repo's token can read it
          gh release download "$TAG" --repo "$FROM" --dir dl
          ls -la dl
          ls dl/*.exe >/dev/null 2>&1 && ls dl/latest.yml >/dev/null 2>&1 && ls dl/*.dmg >/dev/null 2>&1 \
            || { echo "::error::$FROM $TAG is missing the .exe, latest.yml or .dmg - wait for both builds to finish"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --latest --notes "Copied from $FROM"
          for i in 1 2 3 4; do
            gh release upload "$TAG" dl/* --repo "$GITHUB_REPOSITORY" --clobber && break
            echo "attempt $i failed"; sleep 20
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          for F in dl/*; do
            N="$(basename "$F")"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -Fxq "$N" \
              || { echo "::error::$N did not land on $TAG"; exit 1; }
          done
          echo "Copied $TAG: $(ls dl | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
