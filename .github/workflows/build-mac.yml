# Builds the Mac app (ONE universal DMG - Apple Silicon + Intel) on
# GitHub's macOS runners — no Mac needed locally.
#
# Runs when:
#   - a version tag is pushed (v1.28.0 ...) -> builds AND attaches the
#     installers to a GitHub Release for that tag
#   - the "Run workflow" button is pressed on the Actions tab -> builds and
#     leaves the installers as a downloadable artifact
#
# Code signing (optional, needs an Apple Developer account): add these
# repository secrets and the same build signs + notarizes automatically:
#   MAC_CSC_LINK            base64 of the Developer ID Application .p12
#   MAC_CSC_KEY_PASSWORD    the .p12 password
#   APPLE_ID                Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password from appleid.apple.com
#   APPLE_TEAM_ID           10-char team id
# Without them the app builds unsigned: it runs fine, but macOS Gatekeeper
# makes the first open awkward (System Settings -> Privacy & Security ->
# Open Anyway, or: xattr -cr "/Applications/Capture Station.app").

name: Build Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish a GitHub Release under this tag (e.g. v1.27.4); empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write # attach installers to the tag's GitHub Release

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # a release whose installers are stamped with an older version is
      # worse than no release (v1.27.11 shipped 1.27.4-named files on
      # 2026-09-09) — refuse to build a mismatched release at all
      - name: Release tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER - bump package.json first"
            exit 1
          fi

      - name: Build the universal DMG (Apple Silicon + Intel in one)
        # unset the signing env entirely when the secrets are blank —
        # electron-builder treats an EMPTY CSC_LINK as a certificate path
        # and dies with "not a file" (seen 2026-09-09, run 1)
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Keep the installers as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-station-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*.dmg
          generate_release_notes: true

      # uploads only add files — anything from an earlier, differently
      # named build would linger on the release forever. Sweep every
      # asset that doesn't carry this build's version.
      - name: Sweep stale assets off the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          VER="$(node -p "require('./package.json').version")"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r A; do
            case "$A" in
              *"$VER"*) ;;
              *) echo "removing stale asset $A"; gh release delete-asset "$TAG" "$A" --repo "$GITHUB_REPOSITORY" -y ;;
            esac
          done
