# Starts the Mac build. The build itself runs in the public
# amiablet21/capture-station-releases repo (its "Build" workflow), which
# checks out this commit, builds, and publishes the GitHub Release there —
# the repo the in-app updater reads. It moved there so this repo can be
# private: a public repo's Actions minutes are free, and ~125 releases a
# month would overrun a private repo's 2,000 (owner 2026-10-18).
#
# Runs when:
#   - a version tag is pushed (v1.32.86 ...) -> builds AND publishes
#   - the "Run workflow" button is pressed on the Actions tab -> builds;
#     with a release_tag it also tags this commit and publishes
# The build's progress and installers are on the releases repo's Actions
# tab, not here.
#
# Needs one repository secret: RELEASE_BOT_TOKEN, a fine-grained token
# for capture-station + capture-station-releases with Contents: read and
# Actions: read and write (the releases repo keeps the same token to check
# this repo out).

name: Build Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish a GitHub Release under this tag (e.g. v1.32.86); empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write # tag the built commit here, as the releases used to

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: amiablet21/capture-station-releases
    steps:
      - uses: actions/checkout@v4

      # a release whose installers are stamped with an older version is
      # worse than no release (v1.27.11 shipped 1.27.4-named files on
      # 2026-09-09) — refuse to start a mismatched release at all
      - name: Release tag must match package.json version
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          [ -n "$TAG" ] || exit 0
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VER - bump package.json first"
            exit 1
          fi

      # keeps every version findable in this repo's history; a tag made
      # with the workflow token does not re-trigger this workflow
      - name: Tag the built commit
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null \
            || { echo "::error::could not create tag $TAG"; exit 1; }

      - name: Start the build in capture-station-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_BOT_TOKEN secret is missing - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          gh workflow run build.yml --repo "$RELEASE_REPO" \
            -f source_sha="$GITHUB_SHA" -f release_tag="$TAG" -f platform=mac
          {
            echo "Started the Mac build of \`${GITHUB_SHA::7}\`${TAG:+ for $TAG}."
            echo ""
            echo "Progress and installers: https://github.com/$RELEASE_REPO/actions/workflows/build.yml"
          } >> "$GITHUB_STEP_SUMMARY"
